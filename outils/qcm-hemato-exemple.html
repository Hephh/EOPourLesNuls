<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QCM Hématologie — exemple · EOPour les nuls</title>
<meta name="theme-color" content="#ffffff">
<script src="../reglages.js?v=7"></script>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icones/icone-192.png">
<link rel="stylesheet" href="../style.css?v=7">
<style>
  .qcm { max-width: 560px; margin: 0 auto; padding: max(8px, env(safe-area-inset-top)) 14px 0; }
  /* Barre segmentée façon stories : un segment par question */
  .segments { display: flex; gap: 4px; padding: 6px 0 10px; }
  .segments i { flex: 1; height: 3px; border-radius: 99px; background: var(--line); transition: background .25s; }
  .segments i.cour { background: var(--text); }
  .segments i.fait { background: var(--accent); }
  .segments i.ok { background: var(--ok); }
  .segments i.ko { background: var(--ko); }
  .qcm-tete { display: flex; align-items: center; gap: 10px; padding-bottom: 12px; }
  .qcm-tete .post-qui { flex: 1; min-width: 0; }
  .qcm-tete .post-qui b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chrono {
    flex: none; padding: 4px 10px; border-radius: 99px; background: var(--bg-2);
    font-size: .85rem; font-weight: 750; font-variant-numeric: tabular-nums;
  }
  .chrono.urgent { background: var(--ko-soft); color: var(--ko); }
  .fermer { display: grid; place-items: center; width: 44px; height: 44px; margin-right: -8px; border-radius: 50%; color: var(--text); }
  .fermer svg { width: 26px; height: 26px; }
  .carte { padding: 18px 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
  .consigne { margin: 0 0 6px; color: var(--muted); font-size: .8rem; }
  #question { margin: 0 0 14px; font-size: 1.12rem; font-weight: 700; line-height: 1.4; }
  #options { display: grid; gap: 10px; }
  .opt {
    display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 12px 14px;
    text-align: left; border: 2px solid var(--line); border-radius: 12px;
    background: var(--surface); color: var(--text); cursor: pointer;
    transition: border-color .12s, background .12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt:disabled { cursor: default; }
  .lettre {
    flex: none; display: grid; place-items: center; width: 30px; height: 30px;
    border-radius: 8px; background: var(--bg-2); font-weight: 750; font-size: .85rem;
  }
  .txt { flex: 1; }
  .etat { flex: none; width: 1.2em; text-align: center; font-weight: 800; }
  .opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .opt[aria-pressed="true"] .lettre { background: var(--accent); color: var(--accent-text); }
  /* Correction (après les états "coché" pour passer devant) */
  .opt.ok { border-color: var(--ok); background: var(--ok-soft); }
  .opt.ko { border-color: var(--ko); background: var(--ko-soft); }
  .opt.manque { border-color: var(--ok); border-style: dashed; }
  .opt.ok .etat, .opt.manque .etat { color: var(--ok); }
  .opt.ko .etat { color: var(--ko); }
  .verdict { margin: 14px 0 0; font-weight: 750; }
  .verdict.ok { color: var(--ok); }
  .verdict.ko { color: var(--ko); }
  #explication {
    margin: 8px 0 0; padding: 12px 14px; border-radius: 12px; border-left: 4px solid var(--accent);
    background: var(--bg-2); font-size: .95rem;
  }
  #verdict, #explication { scroll-margin-bottom: 96px; } /* reste visible au-dessus du bouton collant */
  .actions {
    position: sticky; bottom: 0; margin-top: 4px;
    padding: 14px 0 max(14px, env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 75%, transparent);
  }
  .fin { margin: 6px 0 24px; text-align: center; }
  .gros-score {
    margin: 6px 0; font-size: 3.4rem; font-weight: 900; line-height: 1.05;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #msg { margin: 12px 0 4px; font-weight: 650; }
  #synchro { margin-top: 6px; font-size: .88rem; }
  .fin-btns { display: grid; gap: 10px; margin-top: 18px; }
  /* Mode examen : correction détaillée en fin de partie */
  #revue { margin-top: 22px; text-align: left; }
  #revue h3 { margin: 0 0 10px; font-size: 1rem; }
  #revue ol { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
  .revue-q { padding: 12px; border: 1px solid var(--line); border-left: 4px solid var(--ko); border-radius: 12px; }
  .revue-q.ok { border-left-color: var(--ok); }
  .revue-enonce { margin: 0 0 8px; font-weight: 700; }
  .revue-q ul { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; font-size: .9rem; }
  .revue-q ul li { padding: 6px 8px; border-radius: 8px; }
  .revue-q ul li.bonne { background: var(--ok-soft); }
  .revue-q ul li.fausse { background: var(--ko-soft); }
  .revue-q ul li.cochee { font-weight: 700; }
  .revue-expl { margin: 8px 0 0; color: var(--muted); font-size: .88rem; }
</style>
</head>
<body>
<div class="qcm">
  <div id="segments" class="segments" aria-hidden="true"></div>
  <header class="qcm-tete">
    <span class="mini-ring"><span>🩸</span></span>
    <div class="post-qui"><b>QCM Hématologie — exemple</b><small id="compteur"></small></div>
    <span id="chrono" class="chrono" role="timer" hidden></span>
    <a class="fermer" href="../index.html" aria-label="Fermer et revenir à l'accueil">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </a>
  </header>

  <div id="jeu">
    <section class="carte">
      <p class="consigne" id="consigne"></p>
      <p id="question"></p>
      <div id="options"></div>
      <p id="verdict" class="verdict" role="status" hidden></p>
      <p id="explication" hidden></p>
    </section>
    <div class="actions"><button id="action" class="btn btn-primary btn-plein" type="button">Valider</button></div>
  </div>

  <section id="fin" class="carte fin" hidden>
    <p class="sub">Résultat</p>
    <p id="score" class="gros-score"></p>
    <p id="pct" class="sub"></p>
    <p id="msg"></p>
    <p id="record" class="sub"></p>
    <p id="synchro" class="sub"></p>
    <div class="fin-btns">
      <button id="refaire" class="btn btn-primary" type="button"></button>
      <button id="recommencer" class="btn" type="button">Recommencer tout le QCM</button>
      <a class="btn" href="../index.html">Retour à l'accueil</a>
    </div>
    <section id="revue" hidden></section>
  </section>
</div>

<script type="module">
import { enregistrerScore, noterActivite, comptesActifs } from "../compte.js?v=7";

/* ===================== QUESTIONS — remplace par les tiennes =====================
   bonnes : numéros des bonnes propositions (0 = la 1re). Plusieurs possibles.     */
const QUESTIONS = [
  {
    q: "Durée de vie moyenne d'une hématie (globule rouge) :",
    choix: ["8 jours", "30 jours", "120 jours", "1 an"],
    bonnes: [2],
    explication: "≈ 120 jours. Les hématies vieillies sont ensuite détruites par les macrophages, surtout dans la rate."
  },
  {
    q: "Concernant les plaquettes :",
    choix: [
      "Elles proviennent de la fragmentation des mégacaryocytes",
      "Ce sont des cellules nucléées",
      "Valeurs normales : 150 à 400 G/L",
      "Leur durée de vie est d'environ 120 jours"
    ],
    bonnes: [0, 2],
    explication: "Fragments cytoplasmiques anucléés issus des mégacaryocytes de la moelle ; 150–400 G/L ; durée de vie ≈ 7 à 10 jours."
  },
  {
    q: "L'hémophilie A est due à un déficit en :",
    choix: ["Facteur VII", "Facteur VIII", "Facteur IX", "Facteur XII"],
    bonnes: [1],
    explication: "Hémophilie A = facteur VIII ; hémophilie B = facteur IX. Transmission récessive liée à l'X."
  },
  {
    q: "Transfusion de concentrés de globules rouges (CGR) :",
    choix: [
      "Un receveur de groupe O peut recevoir des CGR de groupe A",
      "O négatif est le donneur « universel » de CGR",
      "AB positif est le receveur « universel » de CGR",
      "Un receveur Rh négatif peut toujours recevoir du Rh positif"
    ],
    bonnes: [1, 2],
    explication: "Les hématies O– ne portent ni A, ni B, ni D. Le plasma d'un sujet AB n'a ni anti-A ni anti-B, alors qu'un sujet O possède des anti-A et anti-B naturels. Chez un receveur Rh–, on transfuse du Rh– (risque d'allo-immunisation anti-D), surtout chez la femme en âge de procréer."
  },
  {
    q: "Le plasma représente environ quelle part du volume sanguin ?",
    choix: ["10 %", "25 %", "55 %", "90 %"],
    bonnes: [2],
    explication: "Plasma ≈ 55 % ; éléments figurés ≈ 45 %, essentiellement les hématies (cf. hématocrite). Le plasma lui-même contient environ 90 % d'eau."
  },
  {
    q: "Hémostase primaire :",
    choix: [
      "Elle débute par une vasoconstriction réflexe",
      "Le facteur Willebrand permet l'adhésion des plaquettes au sous-endothélium",
      "Elle aboutit directement à la formation d'un caillot de fibrine",
      "Elle aboutit à la formation du clou plaquettaire"
    ],
    bonnes: [0, 1, 3],
    explication: "Temps vasculaire (vasoconstriction) puis temps plaquettaire : adhésion (vWF – GPIb), activation, agrégation (fibrinogène – GPIIb/IIIa) → clou plaquettaire (thrombus blanc). La fibrine relève de la coagulation."
  },
  {
    q: "Chez l'adulte, l'érythropoïétine (EPO) est principalement produite par :",
    choix: ["Le foie", "Le rein", "La moelle osseuse", "La rate"],
    bonnes: [1],
    explication: "≈ 90 % rénale, en réponse à l'hypoxie. Le foie est le principal site de production chez le fœtus."
  },
];
/* ================================================================================= */

// Options choisies dans Réglages (reglages.js)
const R = window.Reglages ? window.Reglages.lire() : {};
const MELANGER_QUESTIONS = R.melangerQuestions !== false;
const MELANGER_CHOIX = R.melangerChoix !== false;
const EXAMEN = R.correction === "fin";
const CHRONO = Number(R.chrono) > 0 ? Number(R.chrono) : 0;
const VIBRER = R.vibrations !== false && typeof navigator.vibrate === "function";
const ID = (location.pathname.split("/").pop() || "").replace(/\.html$/, ""); // = id dans outils.js

const $ = (s) => document.querySelector(s);
const melanger = (arr) => {
  const a = [...arr];
  for (let k = a.length - 1; k > 0; k--) {
    const j = Math.floor(Math.random() * (k + 1));
    [a[k], a[j]] = [a[j], a[k]];
  }
  return a;
};

let serie = [];      // questions de la partie en cours
let i = 0;           // question affichée
let score = 0;
let erreurs = [];    // questions ratées (pour « Refaire mes erreurs »)
let reponses = [];   // { choisis, juste } par question
let choisis = new Set();
let corrige = false;
let minuteur = null;
let restant = 0;

function preparer(q) {
  const opts = q.choix.map((texte, k) => ({ texte, bonne: q.bonnes.includes(k) }));
  return { ...q, opts: MELANGER_CHOIX ? melanger(opts) : opts, source: q };
}

function segments(fin = false) {
  $("#segments").innerHTML = serie.map((_, k) => {
    const r = reponses[k];
    const c = r ? (EXAMEN && !fin ? "fait" : r.juste ? "ok" : "ko") : k === i ? "cour" : "";
    return `<i class="${c}"></i>`;
  }).join("");
}

function demarrer(liste) {
  serie = (MELANGER_QUESTIONS ? melanger(liste) : [...liste]).map(preparer);
  i = 0;
  score = 0;
  erreurs = [];
  reponses = [];
  $("#fin").hidden = true;
  $("#revue").hidden = true;
  $("#jeu").hidden = false;
  $("#consigne").textContent = "Une ou plusieurs réponses exactes · coche puis valide" + (EXAMEN ? " · correction à la fin" : "");
  afficher();
  window.scrollTo({ top: 0 });
}

function afficher() {
  const q = serie[i];
  choisis = new Set();
  corrige = false;
  $("#compteur").textContent = `Question ${i + 1} / ${serie.length}${EXAMEN ? " · mode examen" : ""}`;
  segments();
  $("#question").textContent = q.q;
  const box = $("#options");
  box.innerHTML = "";
  q.opts.forEach((o, k) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "opt";
    b.setAttribute("aria-pressed", "false");
    b.innerHTML = `<span class="lettre">${"ABCDEFGH"[k]}</span><span class="txt"></span><span class="etat" aria-hidden="true"></span>`;
    b.querySelector(".txt").textContent = o.texte;
    b.onclick = () => basculer(k, b);
    box.appendChild(b);
  });
  $("#verdict").hidden = true;
  $("#explication").hidden = true;
  const btn = $("#action");
  btn.textContent = EXAMEN ? (i + 1 < serie.length ? "Valider et continuer →" : "Valider et terminer") : "Valider";
  btn.disabled = true;
  lancerChrono();
}

function basculer(k, b) {
  if (corrige) return;
  if (choisis.has(k)) choisis.delete(k); else choisis.add(k);
  b.setAttribute("aria-pressed", String(choisis.has(k)));
  $("#action").disabled = choisis.size === 0;
}

/* ---------- Chrono par question ---------- */
function lancerChrono() {
  arreterChrono();
  const c = $("#chrono");
  c.hidden = !CHRONO;
  if (!CHRONO) return;
  restant = CHRONO;
  majChrono();
  minuteur = setInterval(() => {
    restant--;
    majChrono();
    if (restant <= 0) valider(true); // temps écoulé : on valide tel quel
  }, 1000);
}
function arreterChrono() {
  if (minuteur) clearInterval(minuteur);
  minuteur = null;
}
function majChrono() {
  const c = $("#chrono");
  c.textContent = `⏱ ${Math.max(0, restant)} s`;
  c.classList.toggle("urgent", restant <= 5);
}

/* ---------- Validation ---------- */
function valider(tempsEcoule = false) {
  if (corrige) return;
  arreterChrono();
  corrige = true;
  const q = serie[i];
  const juste = q.opts.every((o, k) => o.bonne === choisis.has(k));
  reponses[i] = { choisis: new Set(choisis), juste };
  if (juste) score++; else erreurs.push(q.source);
  if (EXAMEN) return suivant(); // mode examen : rien n'est montré avant la fin
  montrerCorrection(juste, tempsEcoule);
}

function montrerCorrection(juste, tempsEcoule) {
  const q = serie[i];
  [...$("#options").children].forEach((b, k) => {
    const o = q.opts[k];
    const coche = choisis.has(k);
    b.disabled = true;
    if (o.bonne && coche) b.classList.add("ok");
    else if (!o.bonne && coche) b.classList.add("ko");
    else if (o.bonne && !coche) b.classList.add("manque");
    b.querySelector(".etat").textContent = o.bonne ? "✓" : (coche ? "✗" : "");
  });
  segments();
  if (VIBRER) navigator.vibrate(juste ? 35 : [70, 50, 70]);
  const v = $("#verdict");
  v.hidden = false;
  v.className = "verdict " + (juste ? "ok" : "ko");
  v.textContent = juste ? "Juste ✓"
    : tempsEcoule ? "Temps écoulé ⏱ — les bonnes réponses sont marquées ✓"
    : "Faux ✗ — les bonnes réponses sont marquées ✓";
  const e = $("#explication");
  e.textContent = q.explication || "";
  e.hidden = !q.explication;
  (q.explication ? e : v).scrollIntoView({ block: "nearest", behavior: "smooth" }); // sur mobile, la correction peut être sous le pli
  const btn = $("#action");
  btn.textContent = i + 1 < serie.length ? "Question suivante →" : "Voir mon résultat";
  btn.disabled = false;
}

function suivant() {
  i++;
  if (i < serie.length) afficher(); else terminer();
}

/* ---------- Fin de partie ---------- */
function afficherRevue() {
  const box = $("#revue");
  box.innerHTML = "<h3>Correction détaillée</h3>";
  const ol = document.createElement("ol");
  serie.forEach((q, k) => {
    const r = reponses[k];
    const li = document.createElement("li");
    li.className = "revue-q " + (r.juste ? "ok" : "ko");
    const p = document.createElement("p");
    p.className = "revue-enonce";
    p.textContent = `${r.juste ? "✓" : "✗"} ${q.q}`;
    li.append(p);
    const ul = document.createElement("ul");
    q.opts.forEach((o, j) => {
      const coche = r.choisis.has(j);
      const item = document.createElement("li");
      item.className = [o.bonne ? "bonne" : "", coche ? "cochee" : "", coche && !o.bonne ? "fausse" : ""].join(" ").trim();
      item.textContent = `${"ABCDEFGH"[j]}. ${o.texte}${coche ? "  ← ta réponse" : ""}`;
      ul.append(item);
    });
    li.append(ul);
    if (q.explication) {
      const ex = document.createElement("p");
      ex.className = "revue-expl";
      ex.textContent = q.explication;
      li.append(ex);
    }
    ol.append(li);
  });
  box.append(ol);
  box.hidden = false;
}

async function terminer() {
  arreterChrono();
  const total = serie.length;
  const pct = Math.round((score / total) * 100);
  segments(true);
  $("#compteur").textContent = "Terminé";
  $("#chrono").hidden = true;
  $("#jeu").hidden = true;
  $("#fin").hidden = false;
  $("#score").textContent = `${score} / ${total}`;
  $("#pct").textContent = `${pct} % de bonnes réponses`;
  $("#msg").textContent = pct >= 80 ? "Excellent 🔥" : pct >= 50 ? "Pas mal — encore un tour pour fixer 💪" : "On refait les erreurs ? C'est comme ça qu'on retient 📚";
  const r = $("#refaire");
  r.hidden = erreurs.length === 0;
  r.textContent = `Refaire mes erreurs (${erreurs.length})`;
  $("#recommencer").classList.toggle("btn-primary", erreurs.length === 0);
  if (EXAMEN) afficherRevue();
  window.scrollTo({ top: 0 });

  noterActivite(); // compte pour l'objectif du jour et la série 🔥
  const record = $("#record");
  const synchro = $("#synchro");
  record.textContent = "";
  synchro.textContent = "";
  if (total !== QUESTIONS.length) return; // le record ne compte que sur le QCM complet
  const res = await enregistrerScore(ID, score, total);
  record.textContent = `Meilleur score : ${res.score.best} / ${res.score.total}`;
  if (res.synchro === true) synchro.textContent = "☁️ Progression sauvegardée sur ton compte";
  else if (res.synchro === false) synchro.textContent = "⚠️ Hors connexion : sauvegardé sur cet appareil seulement";
  else if (comptesActifs) synchro.innerHTML = `<a href="../index.html#profil">Connecte-toi</a> pour retrouver ta progression sur tous tes appareils`;
}

$("#action").onclick = () => {
  if (!corrige) return valider();
  suivant();
};
$("#refaire").onclick = () => demarrer(erreurs);
$("#recommencer").onclick = () => demarrer(QUESTIONS);

demarrer(QUESTIONS);
</script>
</body>
</html>
