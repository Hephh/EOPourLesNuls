<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Révisions P1</title>
<meta name="description" content="Outils de révision P1 : QCM et entraînement, sur téléphone ou PC.">
<meta name="theme-color" content="#4f46e5">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<style>
  .search {
    width: 100%; min-height: 48px; margin: 20px 0 12px; padding: 12px 14px;
    border: 1px solid var(--line); border-radius: 12px;
    background: var(--surface); color: var(--text); font: inherit;
  }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; min-height: 40px; padding: 0 16px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface); color: var(--text);
    font: inherit; font-size: .92rem; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; margin-top: 8px; }
  .card {
    display: flex; gap: 14px; align-items: flex-start; padding: 16px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); color: inherit; text-decoration: none;
    transition: border-color .15s, transform .15s;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .ico {
    flex: none; display: grid; place-items: center; width: 48px; height: 48px;
    border-radius: 12px; background: var(--accent-soft); font-size: 1.5rem;
  }
  .card h2 { margin: 0 0 2px; font-size: 1.02rem; line-height: 1.3; }
  .card p { margin: 0; color: var(--muted); font-size: .9rem; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 8px; font-size: .78rem; font-weight: 600; }
  .mat { color: var(--accent); }
  .best { color: var(--ok); }
  .empty { color: var(--muted); text-align: center; padding: 32px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📚 Révisions P1</h1>
    <p class="sub">QCM et outils d'entraînement — sur téléphone comme sur PC.</p>
  </header>

  <input id="recherche" class="search" type="search" placeholder="Rechercher un outil…" aria-label="Rechercher un outil" autocomplete="off">
  <div id="chips" class="chips" role="group" aria-label="Filtrer par matière"></div>
  <main id="grille" class="grid" aria-live="polite"></main>
  <p id="vide" class="empty" hidden>Aucun outil ne correspond.</p>

  <footer>Ta progression est enregistrée sur ton appareil uniquement.</footer>
</div>

<script>
/* ================= LISTE DES OUTILS — une entrée par outil ================= */
const OUTILS = [
  {
    titre: "QCM Hématologie — exemple",
    matiere: "Hématologie",
    description: "7 questions pour tester le modèle : réponses multiples, correction expliquée, refaire ses erreurs.",
    fichier: "outils/qcm-hemato-exemple.html",
    emoji: "🩸"
  },
];
/* =========================================================================== */

const $ = (s) => document.querySelector(s);
const sansAccents = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
let filtre = "Tout";

function meilleurScore(fichier) {
  try {
    const v = JSON.parse(localStorage.getItem("score:" + fichier));
    return v && typeof v.best === "number" ? v : null;
  } catch { return null; }
}

function afficherChips() {
  const matieres = ["Tout", ...new Set(OUTILS.map((o) => o.matiere))];
  const box = $("#chips");
  box.innerHTML = "";
  box.hidden = matieres.length <= 2; // inutile tant qu'il n'y a qu'une matière
  for (const m of matieres) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.textContent = m;
    b.setAttribute("aria-pressed", String(m === filtre));
    b.onclick = () => { filtre = m; afficherChips(); afficherOutils(); };
    box.appendChild(b);
  }
}

function afficherOutils() {
  const q = sansAccents($("#recherche").value.trim());
  const liste = OUTILS.filter((o) =>
    (filtre === "Tout" || o.matiere === filtre) &&
    (!q || sansAccents(`${o.titre} ${o.matiere} ${o.description}`).includes(q))
  );
  const grille = $("#grille");
  grille.innerHTML = "";
  for (const o of liste) {
    const s = meilleurScore(o.fichier);
    const a = document.createElement("a");
    a.className = "card";
    a.href = o.fichier;
    a.innerHTML = `
      <span class="ico" aria-hidden="true"></span>
      <div>
        <h2></h2>
        <p></p>
        <div class="meta"><span class="mat"></span>${s ? '<span class="best"></span>' : ""}</div>
      </div>`;
    a.querySelector(".ico").textContent = o.emoji || "📝";
    a.querySelector("h2").textContent = o.titre;
    a.querySelector("p").textContent = o.description;
    a.querySelector(".mat").textContent = o.matiere;
    if (s) a.querySelector(".best").textContent = `Meilleur score : ${s.best}/${s.total}`;
    grille.appendChild(a);
  }
  $("#vide").hidden = liste.length > 0;
}

$("#recherche").addEventListener("input", afficherOutils);
window.addEventListener("pageshow", afficherOutils); // rafraîchit le score au retour d'un outil
afficherChips();
afficherOutils();
</script>
</body>
</html>
