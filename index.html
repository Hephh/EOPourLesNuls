<main id="vue" class="vue"></main>
<div id="toast" class="toast" role="status" hidden></div>
<dialog id="modal" class="modal"></dialog>

<script type="module">
import { OUTILS, MATIERES, ANNEES, INFOS_MATIERES } from "./outils.js?v=8";
import * as C from "./compte.js?v=8";

const R = window.Reglages;

/* ---------- Outils ---------- */
const $ = (s, r = document) => r.querySelector(s);
const vue = $("#vue");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const sansAccents = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const TEINTES = [174, 199, 228, 256, 282, 322, 350, 18, 146];
const teinte = (txt) => { let h = 0; for (const c of txt) h = (h * 31 + c.codePointAt(0)) >>> 0; return TEINTES[h % TEINTES.length]; };
const initiale = (nom) => (Array.from(String(nom || "?").trim())[0] || "?").toUpperCase();
const navigateurIntegre = /Instagram|FBAN|FBAV|FB_IAB|Snapchat|Line\/|TikTok|musical_ly|; wv\)/i.test(navigator.userAgent);
const lienSite = () => new URL("./", location.href).href;

const svg = (corps) => `<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${corps}</svg>`;
const ICONE = {
  coeur: svg('<path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 7.9 3.6 4.5 7 4.5c2 0 3.6 1.1 5 3 1.4-1.9 3-3 5-3 3.4 0 5.6 3.4 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/>'),
  envoyer: svg('<path d="M21 3 10 14"/><path d="M21 3l-6.5 18-4.5-7-7-4.5z"/>'),
  loupe: svg('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'),
  user: svg('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/>'),
  grille: svg('<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/>'),
  menu: svg('<path d="M4 7h16M4 12h16M4 17h16"/>'),
  retour: svg('<path d="M15 5l-7 7 7 7"/>'),
  fermer: svg('<path d="M6 6l12 12M18 6 6 18"/>'),
};

let minuteurToast;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(minuteurToast);
  minuteurToast = setTimeout(() => (t.hidden = true), 2600);
}

async function partager(titre, url) {
  if (navigator.share) {
    try { await navigator.share({ title: titre, url }); return; }
    catch (e) { if (e.name === "AbortError") return; }
  }
  try { await navigator.clipboard.writeText(url); toast("Lien copié 📋"); }
  catch { toast(url); }
}

function avatar(u) {
  const emoji = C.avatarSur(u?.avatar);
  if (emoji) return `<span class="avatar-ring"><span class="avatar emoji">${emoji}</span></span>`;
  const photo = C.photoSure(u?.photo);
  const contenu = photo ? `<img src="${esc(photo)}" alt="" referrerpolicy="no-referrer">`
    : u ? esc(initiale(u.nom)) : ICONE.user;
  return `<span class="avatar-ring"><span class="avatar">${contenu}</span></span>`;
}

const vide = (icone, titre, texte) => `<div class="vide">${icone}<h2>${esc(titre)}</h2><p>${esc(texte)}</p></div>`;

function grille(liste) {
  return `<div class="grille">${liste.map((o) => {
    const s = C.scoreLocal(o.id);
    return `<a class="tuile" href="${esc(o.fichier)}" style="--h:${teinte(o.matiere)}" aria-label="${esc(o.titre)}">
      <span class="tuile-emoji" aria-hidden="true">${o.emoji || "📝"}</span>
      <span class="tuile-titre">${esc(o.titre)}</span>
      ${s ? `<span class="tuile-badge">${s.best}/${s.total}</span>` : ""}
    </a>`;
  }).join("")}</div>`;
}

/* ---------- Fenêtre modale ---------- */
const modal = $("#modal");
function ouvrirModal(html, brancher) {
  modal.innerHTML = `<div class="modal-corps">${html}</div>`;
  modal.querySelectorAll("[data-fermer]").forEach((b) => (b.onclick = fermerModal));
  brancher?.(modal);
  if (!modal.open) modal.showModal();
}
function fermerModal() { if (modal.open) modal.close(); }
modal.addEventListener("click", (e) => { if (e.target === modal) fermerModal(); }); // clic sur le fond

function confirmer(titre, texte, libelle, action) {
  ouvrirModal(`<h3>${esc(titre)}</h3><p>${esc(texte)}</p>
    <div class="modal-btns">
      <button class="btn btn-danger" type="button" data-ok>${esc(libelle)}</button>
      <button class="btn" type="button" data-fermer>Annuler</button>
    </div>`, (m) => {
    $("[data-ok]", m).onclick = async () => { fermerModal(); await action(); };
  });
}

/* ---------- Catalogue : années, matières, place des outils ----------
   L'admin le publie depuis Admin ▸ Organisation (compte.js, site/catalogue) ; sinon on le déduit de outils.js. */
const slug = (s) => sansAccents(String(s || "")).replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "x";
function catalogueDeBase() {
  const annees = ANNEES.map((a) => ({ id: a.id, nom: a.nom, sous: a.sous || "", verrou: !!a.verrou }));
  const matieres = [], outils = {};
  for (const o of OUTILS) {
    const an = (o.annee || "").toLowerCase();
    let m = matieres.find((x) => x.annee === an && x.nom === o.matiere);
    if (!m) {
      const info = INFOS_MATIERES[o.matiere] || {};
      m = { id: "m-" + slug(an + "-" + o.matiere), annee: an, nom: o.matiere, emoji: MATIERES[o.matiere] || o.emoji || "📚", complet: info.nom || "", prof: info.prof || "" };
      matieres.push(m);
    }
    outils[o.id] = { annee: an, matiere: m.id, cache: false };
  }
  return { annees, matieres, outils, masques: {} };
}
let CAT = catalogueDeBase();
let catPublie = false; // true = l'admin a déjà publié une organisation
function appliquerCatalogue(c) {
  catPublie = !!c;
  const base = catalogueDeBase();
  CAT = c ? { annees: c.annees, matieres: c.matieres, outils: { ...base.outils, ...c.outils }, masques: c.masques || {} } : base;
}
const anneeDe = (id) => CAT.annees.find((a) => a.id === id) || null;
const matiereDe = (id) => CAT.matieres.find((m) => m.id === id) || null;
/** Où l'outil s'affiche : année, matière (ou null = « Autres »), caché ou non. */
function place(o) {
  const p = CAT.outils[o.id] || {};
  const annee = p.annee || (o.annee || "").toLowerCase();
  let m = matiereDe(p.matiere);
  if (p.matiere !== null && (!m || m.annee !== annee)) m = CAT.matieres.find((x) => x.annee === annee && x.nom === o.matiere) || null;
  if (m && m.annee !== annee) m = null;
  return { annee, matiere: m, cache: !!p.cache };
}
const outilsVisibles = () => OUTILS.filter((o) => !place(o).cache);
const outilsAnnee = (a) => outilsVisibles().filter((o) => place(o).annee === a.id);
const matieresAnnee = (a) => CAT.matieres.filter((m) => m.annee === a.id);
const ICONE_VERROU = svg('<rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>');

/* ---------- Accueil : choisir son année ---------- */
function carteBienvenue() {
  try { if (localStorage.getItem("bienvenue-vue")) return ""; } catch {}
  return `<div class="bienvenue" id="bienvenue" role="note">
    <b>Bienvenue sur EOPour les nuls 👋</b>
    <p>Choisis ton année, puis ta matière. Touche ♡ sur un outil pour le garder en favori. Dans Profil, connecte-toi pour retrouver ta progression partout.</p>
    <button class="icon-btn" type="button" id="fermer-bienvenue" aria-label="Masquer ce message">${ICONE.fermer}</button>
  </div>`;
}

function dernierOutil() {
  try { return outilsVisibles().find((o) => o.id === localStorage.getItem("dernier-outil")) || null; } catch { return null; }
}

function vueAccueil() {
  const u = C.utilisateur();
  const prenom = u?.nom ? String(u.nom).trim().split(/\s+/)[0] : "";
  const dernier = dernierOutil();
  vue.innerHTML = `
    <div class="accueil-tete"><h1>${prenom ? "Salut " + esc(prenom) : "Salut"}</h1><p class="sub">Choisis ton année, puis ta matière.</p></div>
    ${carteBienvenue()}
    <div class="annees" role="list">
      ${CAT.annees.map((a) => {
        const n = matieresAnnee(a).length;
        const etat = a.verrou ? " verrou" : n ? "" : " vide-annee";
        return `<a class="annee${etat}" role="listitem" href="#${esc(a.id)}"${a.verrou ? ` aria-label="${esc(a.nom)}, verrouillé"` : ""}>
          <span class="annee-ring"><span class="annee-bulle">${esc(a.nom)}</span>${a.verrou ? `<span class="annee-cadenas">${ICONE_VERROU}</span>` : ""}</span>
          <b>${esc(a.sous)}</b>
          <small>${a.verrou ? "Verrouillé" : n ? `${n} matière${n > 1 ? "s" : ""}` : "Aucune matière"}</small>
        </a>`;
      }).join("")}
    </div>
    ${dernier ? `<h2 class="titre-section">Reprendre</h2><div class="lignes">${ligneOutil(dernier)}</div>` : ""}`;
  $("#fermer-bienvenue")?.addEventListener("click", () => {
    try { localStorage.setItem("bienvenue-vue", "1"); } catch {}
    $("#bienvenue").remove();
  });
  brancherLignes();
}

/* ---------- Une année : ses matières (bulles), puis les outils de la matière ---------- */
const matiereChoisie = {};
const AUTRES = { id: "_autres", nom: "Autres", emoji: "📦", complet: "Autres outils", prof: "" };

function vueAnnee(id) {
  const a = anneeDe(id);
  const retour = `<div class="profil-barre" style="margin: 0; padding: 0 8px 0 4px;">
    <a class="icon-btn" href="#accueil" aria-label="Retour aux années">${ICONE.retour}</a><b>${esc(a.nom)}${a.sous ? " · " + esc(a.sous) : ""}</b><span style="width: 44px;"></span></div>`;
  if (a.verrou) {
    vue.innerHTML = retour + `<div class="vide">${ICONE_VERROU}<h2>${esc(a.nom)} est verrouillé</h2><p>Ce parcours ouvrira plus tard.</p></div>`;
    return;
  }
  const outils = outilsAnnee(a);
  const matieres = matieresAnnee(a).slice();
  if (outils.some((o) => !place(o).matiere)) matieres.push(AUTRES);
  if (!matieres.length) {
    vue.innerHTML = retour + vide(ICONE.grille, `Pas encore de matière en ${a.nom}`, "Les matières s'ajouteront ici au fil des cours.");
    return;
  }
  let m = matieres.find((x) => x.id === matiereChoisie[id]) || matieres[0];
  matiereChoisie[id] = m.id;
  const liste = outils.filter((o) => (place(o).matiere?.id || AUTRES.id) === m.id);
  vue.innerHTML = retour + `
    <div class="stories" role="group" aria-label="Matières de ${esc(a.nom)}">
      ${matieres.map((x) => `
        <button class="story${x.id === m.id ? " actif" : ""}" type="button" data-m="${esc(x.id)}" aria-pressed="${x.id === m.id}">
          <span class="story-ring"><span class="story-bulle">${esc(x.emoji || "📚")}</span></span>
          <span class="story-nom">${esc(x.nom)}</span>
        </button>`).join("")}
    </div>
    <div class="matiere-tete">
      <span class="mini-ring grand"><span>${esc(m.emoji || "📚")}</span></span>
      <div><h1>${esc(m.complet || m.nom)}</h1><p class="sub">${[m.complet ? m.nom : "", m.prof, `${liste.length} outil${liste.length > 1 ? "s" : ""}`].filter(Boolean).map(esc).join(" · ")}</p></div>
    </div>
    ${liste.length ? `<div class="lignes">${liste.map(ligneOutil).join("")}</div>` : `<p class="vide-mini">Pas encore d'outil dans cette matière.</p>`}`;
  vue.querySelectorAll(".story").forEach((b) => (b.onclick = () => { matiereChoisie[id] = b.dataset.m; vueAnnee(id); }));
  brancherLignes();
}

/* Un outil = une ligne : emoji, titre, type, meilleur score, favori. */
function ligneOutil(o) {
  const s = C.scoreLocal(o.id);
  const fav = C.favorisLocaux().has(o.id);
  return `<div class="ligne-outil" data-id="${esc(o.id)}">
    <a class="lo-lien" href="${esc(o.fichier)}">
      <span class="lo-emoji" style="--h:${teinte(o.matiere)}" aria-hidden="true">${o.emoji || "📝"}</span>
      <span class="lo-txt"><b>${esc(o.titre)}</b><small>${esc(o.type || "Outil")}${s ? ` · meilleur score ${s.best}/${s.total}` : ""}</small>
        <span class="lo-desc">${esc(o.description)}</span>
        ${s ? `<span class="jauge"><i style="width:${Math.round((s.best / s.total) * 100)}%"></i></span>` : ""}</span>
    </a>
    <span class="lo-actions">
      <button class="action com" type="button" data-com="${esc(o.id)}" aria-label="Commentaires sur ${esc(o.titre)}">${ICONE_BULLE}<span class="com-n"></span></button>
      <button class="action like${fav ? " on" : ""}" type="button" aria-pressed="${fav}" aria-label="${fav ? "Retirer des favoris" : "Ajouter aux favoris"}">${ICONE.coeur}</button>
    </span>
  </div>`;
}

function brancherLignes() {
  vue.querySelectorAll(".ligne-outil").forEach((el) => {
    const id = el.dataset.id;
    const like = $(".like", el);
    like.onclick = () => {
      const actif = C.basculerFavori(id);
      like.classList.toggle("on", actif);
      like.setAttribute("aria-pressed", String(actif));
      like.setAttribute("aria-label", actif ? "Retirer des favoris" : "Ajouter aux favoris");
      like.classList.remove("pop");
      void like.offsetWidth;
      like.classList.add("pop");
    };
    $(".lo-lien", el).addEventListener("click", () => { try { localStorage.setItem("dernier-outil", id); } catch {} });
    $("[data-com]", el).onclick = () => ouvrirCommentaires(OUTILS.find((o) => o.id === id));
  });
  majCompteurs();
}

/* ---------- Social : commentaires des outils + messagerie privée ---------- */
let arretVue = null;          // écoute en direct de la vue ouverte (coupée à chaque changement de page)
let convs = [];               // mes conversations (écoute globale, pour la pastille)
let arretConvs = null;
const ICONE_BULLE = svg('<path d="M20.5 11.5a8.5 8.5 0 0 1-12.6 7.4L3.5 20.5l1.6-4.2A8.5 8.5 0 1 1 20.5 11.5z"/>');
const ICONE_MSG = svg('<path d="M12 3C7 3 3 6.6 3 11c0 2.4 1.2 4.6 3.1 6.1L5.5 21l4-2.1c.8.2 1.6.3 2.5.3 5 0 9-3.6 9-8.1S17 3 12 3z"/><path d="m8 12 2.6-2.6L13 12l3-3"/>');
const ICONE_ENVOI = svg('<path d="M21 3 10 14"/><path d="M21 3l-6.5 18-4.5-7-7-4.5z"/>');
const petitAvatar = (u) => `<span class="av-s">${avatar(u)}</span>`;
const quand = (t) => depuis(t).replace("il y a ", "");
const connecteOu = (titre) => C.utilisateur() ? "" : vide(ICONE.user, titre, "Connecte-toi dans l'onglet Profil pour discuter avec les autres membres.");

/* Commentaires d'un outil, dans la fenêtre maison */
function ouvrirCommentaires(o) {
  const u = C.utilisateur();
  if (!C.comptesActifs) return toast("Les comptes ne sont pas encore disponibles");
  if (!u) { toast("Connecte-toi pour lire et écrire des commentaires"); location.hash = "#profil"; return; }
  let arret = () => {};
  let admin = false;
  C.estAdmin().then((a) => { admin = a; });
  ouvrirModal(`<div class="com-tete"><b>Commentaires</b><small>${esc(o.titre)}</small><button class="icon-btn" type="button" data-fermer aria-label="Fermer">${ICONE.fermer}</button></div>
    <div class="com-liste" id="com-liste"><p class="vide-mini">Chargement…</p></div>
    <form class="com-form" id="com-form">
      ${petitAvatar(u)}
      <input class="champ" id="com-texte" maxlength="500" placeholder="Ajoute un commentaire…" autocomplete="off" enterkeyhint="send" aria-label="Ton commentaire">
      <button class="lien" type="submit">Publier</button>
    </form>`, (m) => {
    m.classList.add("modal-com");
    const liste = $("#com-liste", m), champ = $("#com-texte", m);
    const dessiner = (coms) => {
      if (!coms.length) { liste.innerHTML = `<div class="com-vide">${ICONE_BULLE}<b>Pas encore de commentaire</b><p>Lance la discussion : une astuce, une question, une erreur repérée.</p></div>`; return; }
      liste.innerHTML = coms.map((c) => `<div class="com" data-id="${esc(c.id)}">
        ${petitAvatar({ nom: c.nom, photo: c.photo, avatar: c.avatar })}
        <div class="com-corps"><p><b>${esc(c.nom)}</b> ${esc(c.texte)}</p>
          <small>${quand(c.le)} · <button class="lien com-rep" type="button" data-nom="${esc(c.nom)}">Répondre</button>${c.de === u.uid || admin ? ` · <button class="lien com-suppr" type="button">Supprimer</button>` : ""}</small></div>
      </div>`).join("");
      liste.scrollTop = liste.scrollHeight;
      liste.querySelectorAll(".com-rep").forEach((b) => (b.onclick = () => { champ.value = `@${b.dataset.nom} `; champ.focus(); }));

/* Une conversation */
async function vueConversation(autre) {
  const r = rendu;
  const u = C.utilisateur();
  if (!u) { vue.innerHTML = connecteOu("Tes messages privés"); return; }
  const p = (await C.profils([autre]))[autre];
  if (r !== rendu) return;
  vue.innerHTML = `<div class="dm">
    <div class="profil-barre dm-barre"><a class="icon-btn" href="#messages" aria-label="Retour aux messages">${ICONE.retour}</a>${petitAvatar(p)}<b>${esc(p.nom)}</b><span style="width: 44px;"></span></div>
    <div class="dm-fil" id="dm-fil"><p class="vide-mini">Chargement…</p></div>
    <form class="dm-form" id="dm-form">
      <textarea class="champ" id="dm-texte" rows="1" maxlength="1000" placeholder="Écris un message…" aria-label="Ton message"></textarea>
      <button class="icon-btn dm-envoi" type="submit" aria-label="Envoyer">${ICONE_ENVOI}</button>
    </form></div>`;
  const fil = $("#dm-fil"), champ = $("#dm-texte");
  const dessiner = (msgs) => {
    if (!msgs.length) { fil.innerHTML = `<div class="com-vide">${avatar(p)}<b>${esc(p.nom)}</b><p>Écris le premier message.</p></div>`; return; }
    let jour = "";
    fil.innerHTML = msgs.map((m) => {
      const d = new Date(m.le), j = d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
      const sep = j !== jour ? `<p class="dm-jour">${esc(j)}</p>` : "";
      jour = j;
      return `${sep}<div class="bulle${m.de === u.uid ? " moi" : ""}" data-id="${esc(m.id)}" title="${esc(d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }))}">${esc(m.texte)}</div>`;
    }).join("");
    fil.scrollTop = fil.scrollHeight;
    fil.querySelectorAll(".bulle.moi").forEach((b) => (b.onclick = () => confirmer("Supprimer ce message ?", "Il disparaît aussi chez ton correspondant.", "Supprimer",
      async () => { try { await C.supprimerMessage(autre, b.dataset.id); } catch (e) { toast(C.messageErreur(e)); } })));
    C.marquerLu(autre);
  };
  // Conversation pas encore créée : la lecture est refusée tant qu'aucun message n'existe → on réécoute après l'envoi.
  const ecouter = () => { arretVue?.(); arretVue = C.ecouterMessages(autre, dessiner, () => dessiner([])); };
  ecouter();
  champ.addEventListener("input", () => { champ.style.height = "auto"; champ.style.height = Math.min(champ.scrollHeight, 140) + "px"; });
  champ.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && matchMedia("(pointer: fine)").matches) { e.preventDefault(); $("#dm-form").requestSubmit(); } });
  $("#dm-form").onsubmit = async (e) => {
    e.preventDefault();
    const t = champ.value.trim();
    if (!t) return;
    const nouvelle = !convs.some((c) => c.autre === autre);
    champ.value = "";
    champ.style.height = "auto";
    try { await C.envoyerMessage(autre, t); if (nouvelle) ecouter(); } catch (err) { champ.value = t; toast(C.messageErreur(err)); }
  };
  if (matchMedia("(pointer: fine)").matches) champ.focus();
}

/* ---------- Profil + connexion ---------- */
let modeInscription = false;
const LETTRES_JOURS = ["D", "L", "M", "M", "J", "V", "S"];

function statsLocales() {
  const faits = OUTILS.map((o) => C.scoreLocal(o.id)).filter(Boolean);
  const best = faits.reduce((a, s) => a + s.best, 0);
  const total = faits.reduce((a, s) => a + s.total, 0);
  return { faits: faits.length, reussite: total ? Math.round((best / total) * 100) : null, favoris: C.favorisLocaux().size };
}

function blocActivite() {
  const a = C.activiteLocale();
  const objectif = Number(R.lire().objectif) || 3;
  const ajd = a[C.jourCle()] || 0;
  const serie = C.serieJours(a);
  const jours = [];
  const d = new Date();
  d.setDate(d.getDate() - 6);
  for (let k = 0; k < 7; k++) {
    jours.push({ n: a[C.jourCle(d)] || 0, lettre: LETTRES_JOURS[d.getDay()], ajd: k === 6 });
    d.setDate(d.getDate() + 1);
  }
  const max = Math.max(1, ...jours.map((j) => j.n));
  return `<div class="activite">
    <div class="activite-haut">
      <div class="serie">${serie ? "🔥" : "💤"} <b>${serie}</b> jour${serie > 1 ? "s" : ""} d'affilée</div>
      <div class="objectif">Objectif du jour <b>${Math.min(ajd, objectif)}/${objectif}</b>${ajd >= objectif ? " ✅" : ""}
        <span class="jauge"><i style="width:${Math.min(100, Math.round((ajd / objectif) * 100))}%"></i></span></div>
    </div>
    <div class="semaine" aria-label="QCM terminés ces 7 derniers jours">
      ${jours.map((j) => `<div class="jour${j.n ? "" : " vide-jour"}${j.ajd ? " ajd" : ""}" title="${j.n} QCM">
        <i style="height:${j.n ? Math.max(14, Math.round((j.n / max) * 100)) : 6}%"></i><span>${j.lettre}</span></div>`).join("")}
    </div>
  </div>`;
}

      <div class="profil-tete local">${avatar(null)}${stats}</div>

function brancherConnexion() {
  const form = $("#form-email");
  const erreur = (e) => {
    const p = $("#erreur");
    const m = C.messageErreur(e);
    p.textContent = m;
    p.hidden = !m;
  };
  $("#btn-google").onclick = async () => {
    erreur(null);
    try { await C.connexionGoogle(); } catch (e) { erreur(e); }
  };
  $("#btn-bascule").onclick = () => { modeInscription = !modeInscription; vueProfil(); };
  $("#btn-oubli")?.addEventListener("click", async () => {
    const email = form.email.value.trim();
    if (!email) return erreur({ code: "app/email-requis" });
    try { await C.motDePasseOublie(email); toast("Si un compte existe, un e-mail t'a été envoyé"); }
    catch (e) { erreur(e); }
  });
  form.onsubmit = async (ev) => {
    ev.preventDefault();
    erreur(null);
    const bouton = form.querySelector('button[type="submit"]');
    bouton.disabled = true;
    try {
      if (modeInscription) await C.inscriptionEmail(form.nom.value, form.email.value.trim(), form.mdp.value);
      else await C.connexionEmail(form.email.value.trim(), form.mdp.value);
      modeInscription = false;
    } catch (e) {
      erreur(e);
      bouton.disabled = false;
    }
  };
}

/* ---------- Admin ---------- */
const enMs = (t) => (t && typeof t.toMillis === "function" ? t.toMillis() : 0);

function depuis(t) {
  if (!t) return "jamais vu";
  const min = Math.round((Date.now() - t) / 60000);
  if (min < 2) return "à l'instant";
  if (min < 60) return `il y a ${min} min`;
  const h = Math.round(min / 60);
  if (h < 24) return `il y a ${h} h`;
  const j = Math.round(h / 24);
  return j < 30 ? `il y a ${j} j` : new Date(t).toLocaleDateString("fr-FR");
}

function ligneMembre(m) {
  const sc = Object.values(m.scores || {}).filter((s) => s && s.total > 0);
  const b = sc.reduce((a, s) => a + (s.best || 0), 0);
  const t = sc.reduce((a, s) => a + s.total, 0);
  const serie = C.serieJours(m.activite && typeof m.activite === "object" ? m.activite : {});
  return `<li class="membre">${avatar({ nom: m.nom || "?", photo: m.photo, avatar: m.avatar })}
    <div><b>${esc(m.nom || "Sans nom")}</b>
    <small>${sc.length} QCM${t ? ` · ${Math.round((b / t) * 100)} % de réussite` : ""}${serie ? ` · 🔥 ${serie}` : ""} · ${depuis(enMs(m.vuLe))}</small></div></li>`;
}

function monter(liste, i) { if (i > 0) [liste[i - 1], liste[i]] = [liste[i], liste[i - 1]]; }

function actionAdmin(act, id) {
  const c = copieCat();
  switch (act) {
    case "voir-annee": anneeAdmin = id; vueAdmin(); break;
    case "ajout-annee": formAnnee(null); break;
    case "modifier-annee": formAnnee(anneeDe(id)); break;
    case "monter-annee": monter(c.annees, c.annees.findIndex((x) => x.id === id)); publierCat(c, "Ordre des années modifié"); break;
    case "verrou": { const a = c.annees.find((x) => x.id === id); a.verrou = !a.verrou; publierCat(c, a.verrou ? `${a.nom} verrouillée` : `${a.nom} déverrouillée`); break; }
    case "suppr-annee": {
      const a = anneeDe(id);
      confirmer(`Supprimer ${a.nom} ?`, `Ses matières sont supprimées aussi. Ses outils ne sont pas effacés : ils restent dans la recherche et tu pourras les replacer (Outils ▸ Année).`, "Supprimer", async () => {
        const d = copieCat();
        d.annees = d.annees.filter((x) => x.id !== id);
        d.matieres = d.matieres.filter((m) => m.annee !== id);
        for (const o of OUTILS) { const p = place(o); if (p.annee === id) d.outils[o.id] = { annee: "-", matiere: null, cache: p.cache }; }
        anneeAdmin = null;
        await publierCat(d, `${a.nom} supprimée`);
      });
      break;
    }
    case "ajout-mat": formMatiere(null, id); break;
    case "modifier-mat": formMatiere(matiereDe(id), null); break;
    case "monter-mat": {
      const m = matiereDe(id);
      const memes = c.matieres.filter((x) => x.annee === m.annee);
      const i = memes.findIndex((x) => x.id === id);
      if (i > 0) { const a = c.matieres.indexOf(memes[i - 1]), b = c.matieres.indexOf(memes[i]); [c.matieres[a], c.matieres[b]] = [c.matieres[b], c.matieres[a]]; }
      publierCat(c, "Ordre des matières modifié");
      break;
    }
    case "suppr-mat": {
      const m = matiereDe(id);
      confirmer(`Supprimer ${m.nom} ?`, `Ses outils ne sont pas effacés : ils passent dans « Autres » de la même année, et tu peux les replacer.`, "Supprimer", async () => {
        const d = copieCat();
        d.matieres = d.matieres.filter((x) => x.id !== id);
        for (const o of OUTILS) { const p = place(o); if (p.matiere?.id === id) d.outils[o.id] = { annee: p.annee, matiere: null, cache: p.cache }; }
        await publierCat(d, `${m.nom} supprimée`);
      });
      break;
    }
  }
}

/* ---------- Navigation ---------- */
const VUES = { accueil: vueAccueil, recherche: vueRecherche, favoris: vueFavoris, messages: vueMessages, profil: vueProfil, reglages: vueReglages, admin: vueAdmin };
let rendu = 0;

function route() {
  rendu++;
  fermerModal();
  arretVue?.();
  arretVue = null;
  const nom = location.hash.slice(1) || "accueil";
  document.body.classList.toggle("en-dm", nom.startsWith("dm-"));
  if (nom.startsWith("dm-")) {
    document.querySelectorAll(".tab").forEach((t) => {
      const actif = t.dataset.vue === "messages";
      t.classList.toggle("actif", actif);
      if (actif) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current");
    });
    return vueConversation(nom.slice(3));
  }
  const annee = anneeDe(nom) ? nom : null;
  const cle = annee ? "accueil" : Object.prototype.hasOwnProperty.call(VUES, nom) ? nom : "accueil";
  const onglet = cle === "reglages" && !matchMedia("(min-width: 1000px)").matches ? "profil" : cle;
  if (annee) {
    document.querySelectorAll(".tab").forEach((t) => {
      const actif = t.dataset.vue === "accueil";
      t.classList.toggle("actif", actif);
      if (actif) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current");
    });
    return vueAnnee(annee);
  }
  document.querySelectorAll(".tab").forEach((t) => {
    const actif = t.dataset.vue === onglet;
    t.classList.toggle("actif", actif);
    if (actif) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current");
  });
  VUES[cle]();
}

function majOngletProfil(u) {
  const emoji = C.avatarSur(u?.avatar);
  const photo = C.photoSure(u?.photo);
  $("#tab-avatar").innerHTML = emoji ? `<span class="emoji">${emoji}</span>`
    : photo ? `<img src="${esc(photo)}" alt="" referrerpolicy="no-referrer">`
    : u ? `<b>${esc(initiale(u.nom))}</b>` : ICONE.user;
}

window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });
window.addEventListener("pageshow", (e) => { if (e.persisted) route(); }); // retour d'un QCM : scores à jour
$("#partager-site").onclick = () => partager("EOPour les nuls", lienSite());
C.surChangement(async (u) => {
  majOngletProfil(u);
  suivreConversations(u);
  route();
  $('.tab[data-vue="admin"]').hidden = !(await C.estAdmin());
});
appliquerCatalogue(C.catalogueLocal());
majOngletProfil(null);
route();
C.chargerCatalogue().then((c) => { appliquerCatalogue(c); if (location.hash !== "#admin") route(); });

// Appli installable + hors-ligne (réseau d'abord)
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
