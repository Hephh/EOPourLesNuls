<script type="module">
import { OUTILS, MATIERES, ANNEES, INFOS_MATIERES } from "./outils.js?v=15";
import * as C from "./compte.js?v=15";

const R = window.Reglages;

/* ---------- Outils ---------- */
const $ = (s, r = document) => r.querySelector(s);
const vue = $("#vue");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const sansAccents = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const TEINTES = [174, 199, 228, 256, 282, 322, 350, 18, 146];
const teinte = (txt) => { let h = 0; for (const c of txt) h = (h * 31 + c.codePointAt(0)) >>> 0; return TEINTES[h % TEINTES.length]; };
const initiale = (nom) => (Array.from(String(nom || "?").trim())[0] || "?").toUpperCase();
const navigateurIntegre = /Instagram|FBAN|FBAV|FB_IAB|Snapchat|Line\/|TikTok|musical_ly|; wv\)/i.test(navigator.userAgent);
const lienSite = () => new URL("./", location.href).href;

const svg = (corps) => `<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${corps}</svg>`;

  qcm: svg('<rect x="3" y="3.5" width="7" height="7" rx="1.5"/><rect x="3" y="13.5" width="7" height="7" rx="1.5"/><path d="M13.5 7h7.5M13.5 17h7.5M4.8 7l1.5 1.5 2.4-3"/>'),
  megaphone: svg('<path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z"/><path d="M15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12"/>'),
  calendrier: svg('<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>'),
  reglages: svg('<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>'),
  crayon: svg('<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/>'),
  badge: svg('<rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="11" r="2.2"/><path d="M5.8 16c.5-1.6 1.8-2.4 3.2-2.4s2.7.8 3.2 2.4M14.5 10h4M14.5 13.5h3"/>'),
  sortie: svg('<path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M10 16l-4-4 4-4M6 12h10"/>'),
  etincelle: svg('<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/>'),
  melanger: svg('<path d="M16 4h4v4M4 20 20 4M20 16v4h-4M15 15l5 5M4 4l5 5"/>'),
  liste: svg('<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>'),
  vibreur: svg('<rect x="8" y="3" width="8" height="18" rx="2"/><path d="M4 8v8M20 8v8"/>'),
  trophee: svg('<path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8.5 20h7M10 17h4"/>'),
  flamme: svg('<path d="M12 21c-3.9 0-6.5-2.6-6.5-6.2 0-3.3 2.2-5.4 3.6-7.6.3 1.9 1.3 3 2.4 3.6-.2-3 1.1-5.6 3.4-7.8.2 3.1 1.2 4.9 2.3 6.6.8 1.3 1.3 2.9 1.3 5.2 0 3.6-2.6 6.2-6.5 6.2z"/>'),
  etoile: svg('<path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/>'),
  installer: svg('<rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M12 7v7M9 11l3 3 3-3"/>'),
  poubelle: svg('<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'),
  info: svg('<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>'),
  graphique: svg('<path d="M5 20v-7M10.5 20V5M16 20v-10M21 20H3"/>'),
};

let minuteurToast;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(minuteurToast);
  minuteurToast = setTimeout(() => (t.hidden = true), 2600);
}

async function partager(titre, url) {
  if (navigator.share) {
    try { await navigator.share({ title: titre, url }); return; }
    catch (e) { if (e.name === "AbortError") return; }
  }
  try { await navigator.clipboard.writeText(url); toast("Lien copié"); }
  catch { toast(url); }
}

function avatar(u) {
  const emoji = C.avatarSur(u?.avatar);
  if (emoji) return `<span class="avatar-ring"><span class="avatar emoji">${emoji}</span></span>`;
  const photo = C.imageSure(u?.image) || C.photoSure(u?.photo);
  const contenu = photo ? `<img src="${esc(photo)}" alt="" referrerpolicy="no-referrer">`
    : u ? esc(initiale(u.nom)) : ICONE.user;
  return `<span class="avatar-ring"><span class="avatar">${contenu}</span></span>`;
}

const vide = (icone, titre, texte) => `<div class="vide">${icone}<h2>${esc(titre)}</h2><p>${esc(texte)}</p></div>`;


/* ---------- Fenêtre modale ---------- */
const modal = $("#modal");
function ouvrirModal(html, brancher) {
  if (!modal.open) modal.className = "modal";
  modal.innerHTML = `<div class="modal-corps">${html}</div>`;
  modal.querySelectorAll("[data-fermer]").forEach((b) => (b.onclick = fermerModal));
  brancher?.(modal);
  if (!modal.open) modal.showModal();
}
function fermerModal() { if (modal.open) modal.close(); }
modal.addEventListener("click", (e) => { if (e.target === modal) fermerModal(); }); // clic sur le fond

function confirmer(titre, texte, libelle, action) {
  ouvrirModal(`<h3>${esc(titre)}</h3><p>${esc(texte)}</p>
    <div class="modal-btns">
      <button class="btn btn-danger" type="button" data-ok>${esc(libelle)}</button>
      <button class="btn" type="button" data-fermer>Annuler</button>
    </div>`, (m) => {
    $("[data-ok]", m).onclick = async () => { fermerModal(); await action(); };
  });
}

/* ---------- Catalogue : années, matières, place des outils ----------
   L'admin le publie depuis Admin ▸ Organisation (compte.js, site/catalogue) ; sinon on le déduit de outils.js. */
const slug = (s) => sansAccents(String(s || "")).replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "x";
function catalogueDeBase() {
  const annees = ANNEES.map((a) => ({ id: a.id, nom: a.nom, sous: a.sous || "", verrou: !!a.verrou }));
  const matieres = [], outils = {};
  for (const o of OUTILS) {
    const an = (o.annee || "").toLowerCase();
    let m = matieres.find((x) => x.annee === an && x.nom === o.matiere);
    if (!m) {
      const info = INFOS_MATIERES[o.matiere] || {};
      m = { id: "m-" + slug(an + "-" + o.matiere), annee: an, nom: o.matiere, emoji: MATIERES[o.matiere] || o.emoji || "📚", complet: info.nom || "", prof: info.prof || "" };
      matieres.push(m);
    }
    outils[o.id] = { annee: an, matiere: m.id, cache: false };
  }
  return { annees, matieres, outils, masques: {}, annonce: null, images: {} };
}
const ID_BASE = new Set(OUTILS.map((o) => o.id));                                   // outils de outils.js
const ORIG = new Map(OUTILS.map((o) => [o.id, { titre: o.titre, emoji: o.emoji }])); // avant retouche par l'admin
let CAT = catalogueDeBase();
let catPublie = false; // true = l'admin a déjà publié une organisation
function appliquerCatalogue(c) {
  catPublie = !!c;
  for (let k = OUTILS.length - 1; k >= 0; k--) if (!ID_BASE.has(OUTILS[k].id)) OUTILS.splice(k, 1);
  const base = catalogueDeBase();
  CAT = c ? { annees: c.annees, matieres: c.matieres, outils: { ...base.outils, ...c.outils }, masques: c.masques || {}, annonce: c.annonce || null, images: c.images || {} } : base;
  for (const o of OUTILS) {
    const p = CAT.outils[o.id] || {}, d = ORIG.get(o.id);
    o.titre = (typeof p.titre === "string" && p.titre) || d.titre;
    o.emoji = (typeof p.emoji === "string" && p.emoji) || d.emoji;
  }
  // Outils écrits depuis l'admin (QCM, fiches) : une seule page, outils/contenu.html?id=…
  for (const [id, p] of Object.entries(CAT.outils)) {
    if (!p || !p.perso || ID_BASE.has(id) || !/^[a-z0-9-]+$/.test(id)) continue;
    const type = p.type === "fiche" ? "fiche" : "qcm";
    OUTILS.push({ id, perso: true, typePerso: type, titre: String(p.titre || "Sans titre"), emoji: String(p.emoji || "📝"), type: type === "qcm" ? "QCM" : "Fiche",
      description: String(p.description || ""), fichier: "outils/contenu.html?id=" + id, matiere: matiereDe(p.matiere)?.nom || "", annee: p.annee });
  }
}
const anneeDe = (id) => CAT.annees.find((a) => a.id === id) || null;
const matiereDe = (id) => CAT.matieres.find((m) => m.id === id) || null;
/** Où l'outil s'affiche : année, matière (ou null = « Autres »), caché ou non. */
function place(o) {
  const p = CAT.outils[o.id] || {};
  const annee = p.annee || (o.annee || "").toLowerCase();
  let m = matiereDe(p.matiere);
  if (p.matiere !== null && (!m || m.annee !== annee)) m = CAT.matieres.find((x) => x.annee === annee && x.nom === o.matiere) || null;
  if (m && m.annee !== annee) m = null;
  return { annee, matiere: m, cache: !!p.cache || !!p.supprime, nouveau: !!p.nouveau, supprime: !!p.supprime };
}
const outilsVisibles = () => OUTILS.filter((o) => !place(o).cache);
const outilsAnnee = (a) => outilsVisibles().filter((o) => place(o).annee === a.id);
const matieresAnnee = (a) => CAT.matieres.filter((m) => m.annee === a.id);
/** Image de l'admin (médiathèque) si elle existe, sinon l'emoji. */
const visuel = (x, defaut) => (x?.image ? `<img class="visuel" data-media="${esc(x.image)}" alt="">` : esc(x?.emoji || defaut));
const ICONE_VERROU = svg('<rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>');

/* ---------- Aujourd'hui : maîtrise, cours ---------- */
/** Présentation du site pour un nouveau visiteur (rien de commencé sur cet appareil), jusqu'à ce qu'il la ferme. */
function carteBienvenue() {
  try { if (localStorage.getItem("bienvenue-vue")) return ""; } catch {}
  if (Object.keys(C.revisionsLocales()).length || OUTILS.some((o) => C.scoreLocal(o.id))) return "";
  const u = C.utilisateur();
  return `<section class="accueil-hero" id="bienvenue" aria-labelledby="t-hero">
    <div class="hero-txt">
      <span class="hero-sur">Révision en ostéopathie · P1 à P5</span>
      <h2 id="t-hero">Bienvenue sur EOPour les nuls</h2>
      <p>Des cours structurés, des QCM corrigés proposition par proposition et une répétition espacée qui repropose chaque question au bon moment.</p>
      <div class="hero-btns"><a class="btn btn-primary" href="#cours">Parcourir les cours</a>${!u && C.comptesActifs ? `<a class="btn" href="#profil" id="hero-inscription">Créer un compte</a>` : ""}</div>
    </div>
    <ul class="hero-points">
      <li>${ICONES.livre}<span><b>Cours structurés</b><small>Fiches, cartes et schémas, rangés par année et par matière</small></span></li>
      <li>${ICONES.qcm}<span><b>QCM corrigés</b><small>Annales et variantes, avec l'explication de chaque proposition</small></span></li>
      <li>${ICONE_REVOIR}<span><b>Répétition espacée</b><small>Chaque question revient juste avant d'être oubliée</small></span></li>
    </ul>
    <button class="icon-btn hero-fermer" type="button" id="fermer-bienvenue" aria-label="Masquer la présentation">${ICONE.fermer}</button>
  </section>`;
}

function carteAnnonce() {
  const a = CAT.annonce;
  if (!a || !a.texte) return "";
  try { if (localStorage.getItem("annonce-vue") === a.id) return ""; } catch {}
  const cible = !a.lien ? "" : a.lien.startsWith("#") ? anneeDe(a.lien.slice(1))?.nom : OUTILS.find((o) => o.fichier === a.lien)?.titre;
  return `<div class="annonce" id="annonce" role="note"><span class="annonce-ico" aria-hidden="true">${ICONES.megaphone}</span>
    <div class="annonce-txt"><b>${esc(a.titre || "Annonce")}</b><p>${esc(a.texte)}</p>${a.lien && cible ? `<a class="btn btn-primary annonce-btn" href="${esc(a.lien)}">${esc(cible)} →</a>` : ""}</div>
    <button class="icon-btn" type="button" id="fermer-annonce" aria-label="Masquer l'annonce">${ICONE.fermer}</button></div>`;
}

try { for (const k of Object.keys(localStorage)) if (k.startsWith("plan:")) localStorage.removeItem(k); } catch {}

function dernierOutil() {
  try { return outilsVisibles().find((o) => o.id === localStorage.getItem("dernier-outil")) || null; } catch { return null; }
}

const COULEURS_ANNEES = ["#3b82f6", "#6366f1", "#14b8a6", "#f59e0b", "#ef6b5b", "#a855f7", "#64748b"];
const couleurAnnee = (a) => COULEURS_ANNEES[Math.max(0, CAT.annees.indexOf(a)) % COULEURS_ANNEES.length];
const pluriel = (n, mot) => `${n} ${mot}${n > 1 ? "s" : ""}`;
const lienRevision = (mode, outil) => "outils/revision.html?mode=" + mode + (outil ? "&outil=" + encodeURIComponent(outil) : "");
const ICONE_REVOIR = svg('<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>');
const ICONE_ERREUR = svg('<circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/>');
const ICONE_JOUER = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';

/** Maîtrise par catégorie du dernier outil qui a des catégories (sinon le premier). */
function blocMaitrise() {
  const o = [dernierOutil(), ...outilsVisibles()].find((x) => x && (x.categories || []).length);
  if (!o) return "";
  const m = C.maitrise(o.id);
  const masques = CAT.masques[o.id] || [];
  const cats = o.categories.filter(([id]) => !masques.includes(id));
  const vues = Object.values(m).reduce((a, x) => a + x.vues, 0);
  if (!vues) return ""; // rien de commencé : le bloc apparaît avec les premières réponses
  return `<section class="bloc" aria-labelledby="t-maitrise">

/* Notion du jour : un mot du lexique de M.E. (chargé seulement si l'outil est visible) */
let LEXIQUE = null;
function chargerLexique() {
  if (LEXIQUE) return Promise.resolve(LEXIQUE);
  return new Promise((ok) => {
    const s = document.createElement("script");
    s.src = "outils/me-revision/content.js?v=5";
    s.onload = () => { LEXIQUE = (window.CONTENT && window.CONTENT.terms) || []; ok(LEXIQUE); };
    s.onerror = () => ok([]);
    document.head.append(s);
  });
}
async function remplirNotionDuJour(r) {
  const el = $("#notion-jour");
  const me = outilsVisibles().find((o) => o.id === "me-revision");
  if (!el || !me) return;
  const termes = await chargerLexique();
  if (r !== rendu || !termes.length) return;
  const n = Math.floor(Date.now() / 864e5) % termes.length;
  const t = termes[n];
  el.innerHTML = `<span class="rail-titre">Notion du jour</span><b class="notion-nom">${esc(t.t)}</b><p>${esc(t.d)}</p>${t.r ? `<p class="notion-astuce">${esc(t.r)}</p>` : ""}<a class="lien" href="${esc(me.fichier)}#lexique" data-outil="me-revision">Voir dans le lexique →</a>`;
  el.hidden = false;
}

function nomCategorie(outil, ch) {
  const o = OUTILS.find((x) => x.id === outil);

function parOutil(liste) {
  const g = new Map();
  for (const e of liste) {
    if (!g.has(e.o)) g.set(e.o, { outil: e.o, total: 0, cats: new Map() });
    const x = g.get(e.o);
    x.total++;
    const c = nomCategorie(e.o, e.ch) || "Sans catégorie";
    x.cats.set(c, (x.cats.get(c) || 0) + 1);
  }
  return [...g.values()];
}
function listeParOutil(liste, mode) {

function ouvrirPalette() {
  ouvrirModal(`<div class="palette">
      <label class="palette-champ">${ICONE.loupe}<input id="pal-q" type="search" placeholder="Un outil, une matière, une année, une page…" autocomplete="off" aria-label="Rechercher"><kbd>Échap</kbd></label>
      <div class="palette-liste" id="pal-liste" role="listbox" aria-label="Résultats"></div>
    </div>`, (m) => {
    m.classList.add("modal-palette");
    const champ = $("#pal-q", m), liste = $("#pal-liste", m);
    const entrees = [
      ...outilsVisibles().map((o) => ({ titre: o.titre, sous: [o.type, o.matiere, anneeDe(place(o).annee)?.nom].filter(Boolean).join(" · "), href: o.fichier, ico: esc(o.emoji || "📝"), outil: o.id })),
      ...CAT.matieres.filter((x) => anneeDe(x.annee) && !anneeDe(x.annee).verrou).map((x) => ({ titre: x.complet || x.nom, sous: `Matière · ${anneeDe(x.annee).nom}${x.prof ? " · " + x.prof : ""}`, href: "#" + x.annee, ico: visuel(x, "📚") })),
      ...CAT.annees.filter((a) => !a.verrou).map((a) => ({ titre: `${a.nom}${a.sous ? " · " + a.sous : ""}`, sous: "Année", href: "#" + a.id, ico: ICONES.calendrier })),
      ...outilsVisibles().flatMap((o) => (o.categories || []).filter(([id]) => !(CAT.masques[o.id] || []).includes(id))
        .map(([, nom]) => ({ titre: nom, sous: `Catégorie · ${o.titre}`, href: o.fichier, ico: esc(o.emoji || "📝"), outil: o.id }))),
      ...(LEXIQUE || []).map((t) => ({ titre: t.t, sous: "Lexique · " + String(t.d || "").slice(0, 70), href: "outils/me-revision.html#lexique", ico: "Aa", outil: "me-revision" })),
      { titre: "À revoir", sous: "Page · répétition espacée", href: "#revoir", ico: ICONE_REVOIR },
      { titre: "Mes erreurs", sous: "Page", href: "#erreurs", ico: ICONE_ERREUR },
      { titre: "Favoris", sous: "Page", href: "#favoris", ico: ICONE.coeur },
      { titre: "Réglages", sous: "Page · thème, taille du texte, QCM", href: "#reglages", ico: ICONES.reglages },
      { titre: "Profil", sous: "Page · compte et progression", href: "#profil", ico: ICONE.user },
      { titre: "À propos", sous: "Page · le site, vos données", href: "#a-propos", ico: ICONES.info },
    ];
    let sel = 0, vus = [];
    const dessiner = () => {
      const q = sansAccents(champ.value.trim());
      vus = entrees.filter((e) => !q || sansAccents(e.titre + " " + e.sous).includes(q)).slice(0, 12);
      sel = Math.min(sel, Math.max(0, vus.length - 1));
      liste.innerHTML = vus.length ? vus.map((e, i) => `<a class="palette-item${i === sel ? " sel" : ""}" role="option" aria-selected="${i === sel}" href="${esc(e.href)}" data-i="${i}">
        <span class="palette-ico" aria-hidden="true">${e.ico}</span><span class="palette-txt"><b>${esc(e.titre)}</b><small>${esc(e.sous)}</small></span></a>`).join("")
        : `<p class="vide-mini">Aucun résultat.</p>`;
      liste.querySelectorAll("a").forEach((a) => (a.onclick = () => {
        const e = vus[+a.dataset.i];
        if (e.outil) { try { localStorage.setItem("dernier-outil", e.outil); } catch {} }
        fermerModal();
      }));
      liste.querySelector(".sel")?.scrollIntoView({ block: "nearest" });
    };
    champ.oninput = () => { sel = 0; dessiner(); };
    champ.onkeydown = (ev) => {
      if (ev.key === "ArrowDown") { sel = Math.min(sel + 1, vus.length - 1); dessiner(); ev.preventDefault(); }
      else if (ev.key === "ArrowUp") { sel = Math.max(sel - 1, 0); dessiner(); ev.preventDefault(); }
      else if (ev.key === "Enter" && vus[sel]) { ev.preventDefault(); liste.querySelectorAll("a")[sel].click(); }
    };
    dessiner();
    champ.focus();
  });
}
document.addEventListener("keydown", (e) => {

  ouvrirModal(`<div class="com-tete"><b>Commentaires</b><small>${esc(o.titre)}</small><button class="icon-btn" type="button" data-fermer aria-label="Fermer">${ICONE.fermer}</button></div>
    <div class="com-liste" id="com-liste"><p class="vide-mini">Chargement…</p></div>
    <form class="com-form" id="com-form">
      ${petitAvatar(u)}
      <input class="champ" id="com-texte" maxlength="500" placeholder="Ajouter un commentaire…" autocomplete="off" enterkeyhint="send" aria-label="Votre commentaire">
      <button class="lien" type="submit">Publier</button>
    </form>`, (m) => {
    m.classList.add("modal-com");
    const liste = $("#com-liste", m), champ = $("#com-texte", m);
    const dessiner = (coms) => {
      if (!coms.length) { liste.innerHTML = `<div class="com-vide">${ICONE_BULLE}<b>Pas encore de commentaire</b><p>Partagez une astuce, posez une question ou signalez une erreur.</p></div>`; return; }
      liste.innerHTML = coms.map((c) => `<div class="com" data-id="${esc(c.id)}">
        ${petitAvatar({ nom: c.nom, photo: c.photo, avatar: c.avatar })}
        <div class="com-corps"><p><b>${esc(c.nom)}</b> ${esc(c.texte)}</p>
          <small>${quand(c.le)} · <button class="lien com-rep" type="button" data-nom="${esc(c.nom)}">Répondre</button>${c.de === u.uid || admin ? ` · <button class="lien com-suppr" type="button">Supprimer</button>` : ""}</small></div>
      </div>`).join("");
      liste.scrollTop = liste.scrollHeight;
      liste.querySelectorAll(".com-rep").forEach((b) => (b.onclick = () => { champ.value = `@${b.dataset.nom} `; champ.focus(); }));
      liste.querySelectorAll(".com-suppr").forEach((b) => (b.onclick = async () => {
        try { await C.supprimerCommentaire(o.id, b.closest(".com").dataset.id); toast("Commentaire supprimé"); } catch (e) { toast(C.messageErreur(e)); }
      }));
    };
    arret = C.ecouterCommentaires(o.id, dessiner, (e) => { liste.innerHTML = `<p class="erreur vide-mini">${esc(C.messageErreur(e))}</p>`; });
    $("#com-form", m).onsubmit = async (e) => {
      e.preventDefault();
      const t = champ.value.trim();
      if (!t) return;
      champ.value = "";
      try { await C.ajouterCommentaire(o.id, t); majCompteurs(); } catch (err) { champ.value = t; toast(C.messageErreur(err)); }
    };
    if (matchMedia("(pointer: fine)").matches) champ.focus();
  });
  modal.addEventListener("close", () => { arret(); modal.classList.remove("modal-com"); }, { once: true });
}

/* Nombre de commentaires affiché à côté de chaque outil */
async function majCompteurs() {
  if (!C.utilisateur()) return;
  const boutons = [...vue.querySelectorAll("[data-com]")];

  const n = await C.nbCommentaires([...new Set(boutons.map((b) => b.dataset.com))]);
  boutons.forEach((b) => { const v = n[b.dataset.com] || 0; const s = $(".com-n", b); if (s) s.textContent = v ? String(v) : ""; });
}

/* ---------- Profil + connexion ---------- */
let modeInscription = false;
const LETTRES_JOURS = ["D", "L", "M", "M", "J", "V", "S"];

function statsLocales() {
  const faits = OUTILS.map((o) => C.scoreLocal(o.id)).filter(Boolean);
  const best = faits.reduce((a, s) => a + s.best, 0);
  const total = faits.reduce((a, s) => a + s.total, 0);
  return { faits: faits.length, reussite: total ? Math.round((best / total) * 100) : null, favoris: C.favorisLocaux().size };
}

const modeFun = () => R.lire().fun !== false;
function blocActivite() {
  if (!modeFun()) return "";
  const a = C.activiteLocale();
  const objectif = Number(R.lire().objectif) || 3;
  const ajd = a[C.jourCle()] || 0;
  const serie = C.serieJours(a);
  const jours = [];
  const d = new Date();
  d.setDate(d.getDate() - 6);
  for (let k = 0; k < 7; k++) {
    jours.push({ n: a[C.jourCle(d)] || 0, lettre: LETTRES_JOURS[d.getDay()], ajd: k === 6 });
    d.setDate(d.getDate() + 1);
  }
  const max = Math.max(1, ...jours.map((j) => j.n));
  return `<section class="carte activite" aria-label="Activité de la semaine">
    <div class="activite-haut">
      <div class="serie${serie ? "" : " zero"}">${ICONES.flamme}<span><b>${serie}</b> jour${serie > 1 ? "s" : ""} de suite</span></div>
      <div class="objectif">Objectif du jour <b>${Math.min(ajd, objectif)}/${objectif}</b>${ajd >= objectif ? " · atteint" : ""}
        <span class="jauge"><i style="width:${Math.min(100, Math.round((ajd / objectif) * 100))}%"></i></span></div>
    </div>
    <div class="semaine" aria-label="QCM terminés ces 7 derniers jours">
      ${jours.map((j) => `<div class="jour${j.n ? "" : " vide-jour"}${j.ajd ? " ajd" : ""}" title="${j.n} QCM">
        <i style="height:${j.n ? Math.max(14, Math.round((j.n / max) * 100)) : 6}%"></i><span>${j.lettre}</span></div>`).join("")}
    </div>
  </section>`;
}

function vueProfil() {
  const u = C.utilisateur();

      <div class="carte stat-carte"><b>${st.favoris}</b><span>favori${st.favoris > 1 ? "s" : ""}</span></div>

      ${joues.length ? `<div class="lignes">${joues.map(ligneOutil).join("")}</div>` : `<p class="sub">Les QCM terminés apparaîtront ici, avec le meilleur score de chacun.</p>`}</section>`;
  const tete = `<header class="page-tete page-tete-ligne"><div><h1>Profil</h1>${u ? `<p class="sub">Compte, progression et activité.</p>` : ""}</div>

  }
  page(`<section class="carte profil-carte">${avatar(u)}

      <button class="btn" type="button" id="btn-modifier">${ICONES.crayon}Modifier le profil</button>

    ${stats}${blocActivite()}${mesQcm}`);

function brancherConnexion() {
  const form = $("#form-email");
  const erreur = (e) => {
    const p = $("#erreur");
    const m = C.messageErreur(e);
    p.textContent = m;
    p.hidden = !m;
  };
  $("#btn-google").onclick = async () => {
    erreur(null);
    try { await C.connexionGoogle(); } catch (e) { erreur(e); }
  };
  $("#btn-bascule").onclick = () => { modeInscription = !modeInscription; vueProfil(); };
  $("#btn-oubli")?.addEventListener("click", async () => {
    const email = form.email.value.trim();
    if (!email) return erreur({ code: "app/email-requis" });
    try { await C.motDePasseOublie(email); toast("Si un compte existe pour cette adresse, un e-mail de réinitialisation vient d'être envoyé"); }
    catch (e) { erreur(e); }
  });
  form.onsubmit = async (ev) => {
    ev.preventDefault();
    erreur(null);
    const bouton = form.querySelector('button[type="submit"]');
    bouton.disabled = true;
    try {
      if (modeInscription) await C.inscriptionEmail(form.nom.value, form.email.value.trim(), form.mdp.value);
      else await C.connexionEmail(form.email.value.trim(), form.mdp.value);
      modeInscription = false;
    } catch (e) {
      erreur(e);
      bouton.disabled = false;
    }
  };
}

/* ---------- Réglages ---------- */
let invitInstall = null;
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); invitInstall = e; majInviteInstall(); });
window.addEventListener("appinstalled", () => { invitInstall = null; noterInvite(true); fermerInviteInstall(); toast("Application installée"); });
const estInstallee = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const surIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

/* ---------- Proposition d'installation (1re visite sur téléphone) ----------
   Proposée seulement à un membre connecté (après la création de son compte).
   Android/Chrome : bouton « Installer » (invite native). iPhone/iPad : pas à pas Partager → Sur l'écran d'accueil.
   « Plus tard » : reproposée au plus 3 fois, une semaine plus tard. Toujours dispo dans Réglages ▸ Installer l'appli. */
const UA = navigator.userAgent;
const surIPad = /Macintosh/.test(UA) && navigator.maxTouchPoints > 1;          // iPadOS se présente comme un Mac
const surApple = surIOS || surIPad;
const surAndroid = /Android/i.test(UA);
const safariIOS = surApple && !/CriOS|FxiOS|EdgiOS|OPiOS|GSA\//.test(UA);
const ICONE_PARTAGE = svg('<path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/>');
const ICONE_AJOUT = svg('<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/>');
function etatInvite() { try { return JSON.parse(localStorage.getItem("install-propose")) || { n: 0, t: 0 }; } catch { return { n: 99, t: 0 }; } }
function noterInvite(fini) {
  const e = etatInvite();
  try { localStorage.setItem("install-propose", JSON.stringify({ n: fini ? 99 : e.n + 1, t: Date.now() })); } catch {}
}
function fermerInviteInstall() {
  const el = $("#invite-install");
  if (!el) return;
  el.classList.add("sortie");
  setTimeout(() => el.remove(), 250);
}
function contenuInvite() {
  if (navigateurIntegre) return {
    texte: "Pour l'installer, ouvrez d'abord le site dans votre navigateur : menu <b>⋯</b> → « Ouvrir dans le navigateur ».",
    bouton: `<button class="btn btn-primary" type="button" data-inv="copier">Copier le lien</button>`,
  };
  if (surApple) return {
    texte: safariIOS ? "Ajoutez-la à votre écran d'accueil en trois étapes :" : "Ajoutez-la à votre écran d'accueil (si l'option n'apparaît pas, ouvrez le site dans Safari) :",
    etapes: [
      `Touchez <span class="inv-ico">${ICONE_PARTAGE}</span> <b>Partager</b>${safariIOS ? (surIPad ? " en haut" : " en bas de Safari") : ""}`,
      `Choisissez <span class="inv-ico">${ICONE_AJOUT}</span> <b>Sur l'écran d'accueil</b> (faites défiler si besoin)`,
      `Touchez <b>Ajouter</b> en haut à droite`,
    ],
    fleche: safariIOS && !surIPad,
  };
  if (invitInstall) return { texte: "Une icône sur votre écran d'accueil, en plein écran, même hors connexion.", bouton: `<button class="btn btn-primary" type="button" data-inv="installer">Installer</button>` };
  return {
    texte: "Ajoutez-la à votre écran d'accueil :",
    etapes: [`Ouvrez le menu <b>⋮</b> du navigateur`, `Touchez <b>Installer l'application</b> ou <b>Ajouter à l'écran d'accueil</b>`],
  };
}
function dessinerInvite(el) {
  const c = contenuInvite();
  el.classList.toggle("avec-fleche", !!c.fleche);
  el.innerHTML = `<img class="inv-icone" src="icones/icone-192.png" alt="" width="52" height="52">
    <div class="inv-corps">
      <b>Installer EOPour les nuls sur votre téléphone</b>
      <p>${c.texte}</p>
      ${c.etapes ? `<ol class="inv-etapes">${c.etapes.map((e) => `<li>${e}</li>`).join("")}</ol>` : ""}
      <div class="inv-btns">${c.bouton || ""}<button class="btn" type="button" data-inv="plus-tard">Plus tard</button></div>
    </div>
    <button class="icon-btn inv-fermer" type="button" data-inv="plus-tard" aria-label="Fermer">${ICONE.fermer}</button>`;
  el.querySelectorAll("[data-inv]").forEach((b) => (b.onclick = async () => {
    const a = b.dataset.inv;
    if (a === "plus-tard") { noterInvite(false); return fermerInviteInstall(); }
    if (a === "copier") { try { await navigator.clipboard.writeText(lienSite()); toast("Lien copié"); } catch { toast(lienSite()); } return; }
    if (a === "installer" && invitInstall) {
      invitInstall.prompt();
      const choix = await invitInstall.userChoice.catch(() => null);
      invitInstall = null;
      noterInvite(choix?.outcome === "accepted");
      fermerInviteInstall();
    }
  }));
}
/** L'invite Android arrive parfois après l'affichage : on remplace les étapes par le bouton. */
function majInviteInstall() { const el = $("#invite-install"); if (el && surAndroid) dessinerInvite(el); }
let invitePrevue = false;
function proposerInstallation() {
  if (invitePrevue) return;
  if (estInstallee() || !(surApple || surAndroid)) return;
  const e = etatInvite();
  if (e.n >= 3 || Date.now() - e.t < 7 * 864e5) return;
  const montrer = () => {
    if (modal.open) return modal.addEventListener("close", () => setTimeout(montrer, 800), { once: true });
    if ($("#invite-install") || estInstallee()) return;
    const el = document.createElement("aside");
    el.id = "invite-install";
    el.className = "invite-install";
    el.setAttribute("role", "dialog");
    el.setAttribute("aria-label", "Installer l'application");
    dessinerInvite(el);
    document.body.append(el);
  };
  invitePrevue = true;
  setTimeout(montrer, 3000); // laisser d'abord découvrir l'accueil
}

async function installer() {
  if (estInstallee()) return toast("L'application est déjà installée");
  if (invitInstall) {
    invitInstall.prompt();
    await invitInstall.userChoice.catch(() => {});
    invitInstall = null;
    return;
  }
  ouvrirModal(`<h3>Installer l'application</h3>
    <p>${surIOS
      ? "Dans Safari, touchez le bouton Partager (le carré avec une flèche), puis « Sur l'écran d'accueil »."
      : "Ouvrez le menu du navigateur (⋮), puis « Installer l'application » ou « Ajouter à l'écran d'accueil »."}</p>
    <div class="modal-btns"><button class="btn btn-primary" type="button" data-fermer>OK</button></div>`);

/* ---------- Admin ---------- */
const enMs = (t) => (t && typeof t.toMillis === "function" ? t.toMillis() : 0);

function depuis(t) {
  if (!t) return "jamais vu";
  const min = Math.round((Date.now() - t) / 60000);
  if (min < 2) return "à l'instant";
  if (min < 60) return `il y a ${min} min`;
  const h = Math.round(min / 60);
  if (h < 24) return `il y a ${h} h`;
  const j = Math.round(h / 24);
  return j < 30 ? `il y a ${j} j` : new Date(t).toLocaleDateString("fr-FR");
}

function ligneMembre(m) {
  const sc = Object.values(m.scores || {}).filter((s) => s && s.total > 0);
  const b = sc.reduce((a, s) => a + (s.best || 0), 0);
  const t = sc.reduce((a, s) => a + s.total, 0);
  const serie = C.serieJours(activiteDe(m));
  return `<li><button class="membre" type="button" data-uid="${esc(m.uid)}">${avatar({ nom: m.nom || "?", photo: m.photo, avatar: m.avatar })}
    <div><b>${esc(m.nom || "Sans nom")}</b>
    <small>${sc.length} QCM${t ? ` · ${Math.round((b / t) * 100)} % de réussite` : ""}${serie ? ` · série de ${serie} j` : ""} · ${depuis(enMs(m.vuLe))}</small></div>
    <span class="chevron" aria-hidden="true">›</span></button></li>`;
}

const activiteDe = (m) => (m && m.activite && typeof m.activite === "object" && !Array.isArray(m.activite) ? m.activite : {});
const reussiteDe = (m) => {
  const sc = Object.values(m.scores || {}).filter((s) => s && s.total > 0);
  const t = sc.reduce((a, s) => a + s.total, 0);
  return t ? sc.reduce((a, s) => a + (s.best || 0), 0) / t : -1;
};
/** Les n derniers jours (dates), du plus ancien à aujourd'hui. */
function joursRecents(n = 14) {
  return Array.from({ length: n }, (_, i) => { const d = new Date(); d.setDate(d.getDate() - (n - 1) + i); return d; });
}
/** Petit graphique en barres (un jour par barre), avec un résumé pour les lecteurs d'écran. */
function barresJours(valeurs, jours, unite) {
  const max = Math.max(1, ...valeurs);
  const total = valeurs.reduce((a, b) => a + b, 0);
  return `<div class="barres" role="img" aria-label="${total} ${unite} sur ${jours.length} jours">
    ${valeurs.map((v, i) => `<div class="barre${i === valeurs.length - 1 ? " auj" : ""}" title="${jours[i].toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" })} : ${v} ${unite}">
      <span class="barre-n">${v || ""}</span><i style="height:${Math.round((v / max) * 100)}%"></i>
      <small>${jours[i].toLocaleDateString("fr-FR", { weekday: "narrow" })}</small></div>`).join("")}
  </div>`;
}

/* ---------- Admin ▸ Tableau de bord ---------- */
function vueStats(onglets, liste) {
  const jours = joursRecents(14);
  const cles = jours.map((d) => C.jourCle(d));
  const auj = cles[cles.length - 1], sept = cles.slice(-7);
  const actifsAuj = liste.filter((m) => activiteDe(m)[auj]).length;
  const actifs7 = liste.filter((m) => sept.some((j) => activiteDe(m)[j])).length;
  const nouveaux = liste.filter((m) => enMs(m.creeLe) && Date.now() - enMs(m.creeLe) < 7 * 864e5).length;
  const vus24 = liste.filter((m) => Date.now() - enMs(m.vuLe) < 864e5).length;
  const parJour = cles.map((j) => liste.reduce((s, m) => s + (Number(activiteDe(m)[j]) || 0), 0));
  const actifsParJour = cles.map((j) => liste.filter((m) => activiteDe(m)[j]).length);
  const parties7 = parJour.slice(-7).reduce((a, b) => a + b, 0);
  let b = 0, t = 0;
  const parOutil = {};
  for (const m of liste) for (const [id, s] of Object.entries(m.scores || {})) {
    if (!s || !(s.total > 0)) continue;
    b += s.best || 0; t += s.total;
    const o = (parOutil[id] ||= { n: 0, b: 0, t: 0 });
    o.n++; o.b += s.best || 0; o.t += s.total;
  }
  const top = Object.entries(parOutil).sort((x, y) => y[1].n - x[1].n).slice(0, 6);
  const series = liste.map((m) => ({ m, s: C.serieJours(activiteDe(m)) })).filter((x) => x.s > 0).sort((x, y) => y.s - x.s).slice(0, 5);
  const tuile = (n, l, d = "") => `<div class="stat-tuile"><b>${n}</b><span>${l}</span>${d ? `<small>${d}</small>` : ""}</div>`;
  const titreOutil = (id) => OUTILS.find((o) => o.id === id) || { titre: id, emoji: "📝" };
  vue.innerHTML = `<h1 class="titre-vue">Admin</h1>${onglets}
  <div class="reglages admin-stats">
    <div class="stat-tuiles">
      ${tuile(liste.length, "membres", nouveaux ? `+${nouveaux} cette semaine` : "")}
      ${tuile(actifsAuj, "actifs aujourd'hui", `${vus24} passé(s) sur le site en 24 h`)}
      ${tuile(actifs7, "actifs sur 7 jours", liste.length ? `${Math.round((actifs7 / liste.length) * 100)} % des membres` : "")}
      ${tuile(parties7, "parties sur 7 jours", t ? `réussite moyenne ${Math.round((b / t) * 100)} %` : "")}
    </div>
    <h2>Parties par jour</h2>
    <div class="groupe stat-bloc">${barresJours(parJour, jours, "parties")}</div>
    <h2>Membres actifs par jour</h2>
    <div class="groupe stat-bloc">${barresJours(actifsParJour, jours, "membres actifs")}</div>
    <h2>Outils les plus joués</h2>
    <div class="groupe">${top.length ? top.map(([id, s]) => { const o = titreOutil(id); const p = Math.round((s.b / s.t) * 100); return `<div class="ligne stat-outil">
      <span class="ligne-ico" aria-hidden="true">${esc(o.emoji || "📝")}</span>
      <span class="ligne-txt"><b>${esc(o.titre)}</b><small>${s.n} membre${s.n > 1 ? "s" : ""} · réussite moyenne ${p} %</small><span class="jauge"><i style="width:${p}%"></i></span></span></div>`; }).join("")
      : `<div class="ligne"><span class="ligne-txt"><small>Aucun score enregistré pour l'instant.</small></span></div>`}</div>
    <h2>Plus longues séries</h2>
    <div class="groupe">${series.length ? series.map(({ m, s }) => `<button class="ligne" type="button" data-uid="${esc(m.uid)}">${petitAvatar({ nom: m.nom || "?", photo: m.photo, avatar: m.avatar })}
      <span class="ligne-txt"><b>${esc(m.nom || "Sans nom")}</b><small>${s} jour${s > 1 ? "s" : ""} d'affilée</small></span><span class="chevron" aria-hidden="true">›</span></button>`).join("")
      : `<div class="ligne"><span class="ligne-txt"><small>Personne n'a de série en cours.</small></span></div>`}</div>
    <p class="note">Chiffres tirés des comptes (les visiteurs sans compte ne sont pas comptés). <button class="lien" type="button" id="stats-maj">Actualiser</button></p>
  </div>`;
  vue.querySelectorAll("[data-uid]").forEach((el) => (el.onclick = () => ficheMembre(liste.find((m) => m.uid === el.dataset.uid))));
  $("#stats-maj").onclick = async () => { try { await lesMembres(true); } catch {} vueAdmin(); };
}

function vueMembres(onglets, liste) {

  vue.innerHTML = `<h1 class="titre-vue">Admin · ${liste.length} membre${liste.length > 1 ? "s" : ""}</h1>${onglets}
    <div class="adm-outils-membres">

    </div>
    <ul class="membres" id="adm-liste"></ul>`;
  const champ = $("#adm-cherche");
  champ.value = filtreMembres;
  const dessiner = () => {
    const q = sansAccents(filtreMembres.trim());
    const tri = {
      recents: (a, b) => enMs(b.vuLe) - enMs(a.vuLe),
      nom: (a, b) => String(a.nom || "").localeCompare(String(b.nom || ""), "fr"),
      reussite: (a, b) => reussiteDe(b) - reussiteDe(a),
      serie: (a, b) => C.serieJours(activiteDe(b)) - C.serieJours(activiteDe(a)),
    }[triMembres];
    const vus = liste.filter((m) => !q || sansAccents(String(m.nom || "")).includes(q)).sort(tri);
    $("#adm-liste").innerHTML = vus.map(ligneMembre).join("") || `<li class="vide-mini">Aucun membre ne correspond.</li>`;
    vue.querySelectorAll("#adm-liste [data-uid]").forEach((el) => (el.onclick = () => ficheMembre(liste.find((m) => m.uid === el.dataset.uid))));
  };
  champ.oninput = () => { filtreMembres = champ.value; dessiner(); };
  vue.querySelectorAll("[data-tri]").forEach((b) => (b.onclick = () => {
    triMembres = b.dataset.tri;
    vue.querySelectorAll("[data-tri]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    dessiner();
  }));
  dessiner();
}

function ficheMembre(m) {
  if (!m) return;
  const jours = joursRecents(14);
  const a = activiteDe(m);
  const scores = Object.entries(m.scores || {}).filter(([, s]) => s && s.total > 0)
    .map(([id, s]) => ({ o: OUTILS.find((x) => x.id === id) || { titre: id, emoji: "📝" }, s }))
    .sort((x, y) => y.s.best / y.s.total - x.s.best / x.s.total);
  const r = reussiteDe(m);
  const serie = C.serieJours(a);
  const moi = C.utilisateur()?.uid === m.uid;
  const cree = enMs(m.creeLe);
  ouvrirModal(`<div class="fiche-tete">${avatar({ nom: m.nom || "?", photo: m.photo, avatar: m.avatar })}
      <div><h3>${esc(m.nom || "Sans nom")}</h3><small>${cree ? `Inscription le ${new Date(cree).toLocaleDateString("fr-FR")}` : "Date d'inscription inconnue"} · vu ${depuis(enMs(m.vuLe))}</small></div></div>
    <div class="stat-tuiles petites">
      <div class="stat-tuile"><b>${scores.length}</b><span>QCM</span></div>
      <div class="stat-tuile"><b>${r < 0 ? "—" : Math.round(r * 100) + " %"}</b><span>réussite</span></div>
      <div class="stat-tuile"><b>${serie}</b><span>jours de suite</span></div>
      <div class="stat-tuile"><b>${Array.isArray(m.favoris) ? m.favoris.length : 0}</b><span>favoris</span></div>
    </div>
    <p class="sub fiche-sous">Parties sur 14 jours</p>
    ${barresJours(jours.map((d) => Number(a[C.jourCle(d)]) || 0), jours, "parties")}
    ${scores.length ? `<p class="sub fiche-sous">Meilleurs scores</p><div class="fiche-scores">${scores.map(({ o, s }) => `<div><span>${esc(o.emoji || "📝")} ${esc(o.titre)}</span><b>${s.best}/${s.total}</b></div>`).join("")}</div>` : ""}
    <div class="modal-btns">
      <button class="btn" type="button" data-fermer>Fermer</button>
    </div>`, (f) => {
  });
}

/** Publie une nouvelle organisation : visible tout de suite par tout le monde. */
async function publierCat(c, message) {
  try {
    const propre = await C.enregistrerCatalogue(c);
    appliquerCatalogue(propre);
    toast(message || "Enregistré");
  } catch (e) {
    toast(C.messageErreur(e) || "Enregistrement impossible");
  }
  if (location.hash === "#admin") vueAdmin();
}

/** Ouvre le sélecteur de fichiers (à appeler pendant un clic) ; renvoie le fichier choisi ou null. */
function choisirFichier(accept = "image/*") {
  return new Promise((ok) => {
    const i = document.createElement("input");
    i.type = "file";
    i.accept = accept;
    i.onchange = () => ok(i.files[0] || null);
    i.addEventListener("cancel", () => ok(null));
    i.click();
  });
}
/** Choisit une image et l'envoie dans la médiathèque ; renvoie son id (ou null). */
async function televerserImage(cote, nom) {
  const f = await choisirFichier();
  if (!f) return null;
  toast("Envoi de l'image…");
  try {
    const id = await C.televerserMedia(f, { cote, nom });
    toast("Image ajoutée");
    return id;
  } catch (e) {
    toast(C.messageErreur(e));
    return null;
  }
}

/** Image d'une catégorie d'outil (ex. « Coude » dans M.E.) : remplacer ou revenir au schéma d'origine. */
function imageCategorie(o, cid) {
  const nom = (o.categories.find(([c]) => c === cid) || [, cid])[1];
  const actuelle = ((CAT.images || {})[o.id] || {})[cid];
  const poser = (mediaId) => {
    const c = copieCat();
    const imgs = { ...(c.images[o.id] || {}) };
    if (mediaId) imgs[cid] = mediaId; else delete imgs[cid];
    c.images[o.id] = imgs;
    publierCat(c, mediaId ? `Image de ${nom} changée` : `${nom} : schéma d'origine remis`);
  };
  ouvrirModal(`<h3>Image de « ${esc(nom)} »</h3>
    <div class="apercu-img">${actuelle ? `<img data-media="${esc(actuelle)}" alt="">` : `<p class="sub">Schéma d'origine de l'outil.</p>`}</div>
    <p class="sub">Une image carrée marche le mieux (elle est découpée en rond dans la bulle).</p>
    <div class="modal-btns">
      <button class="btn btn-primary" type="button" data-choisir>${actuelle ? "Remplacer l'image" : "Choisir une image"}</button>
      ${actuelle ? `<button class="btn btn-danger" type="button" data-retirer>Remettre le schéma d'origine</button>` : ""}
      <button class="btn" type="button" data-fermer>Annuler</button>
    </div>`, (m) => {
    $("[data-choisir]", m).onclick = async () => { const id = await televerserImage(512, `${o.id} ${cid}`); if (id) { fermerModal(); poser(id); } };
    $("[data-retirer]", m)?.addEventListener("click", () => { fermerModal(); poser(null); });
  });
}

/** Champ « image » d'un formulaire (année, matière) : renvoie { html, brancher(m), valeur() }. */
function champImage(actuelle, cote, nom) {
  let val = actuelle || "";
  const dessin = () => `${val ? `<img class="champ-img-apercu" data-media="${esc(val)}" alt="">` : `<span class="champ-img-vide">Aucune image : l'emoji est utilisé</span>`}
    <button class="btn" type="button" data-img-choisir>${val ? "Changer" : "Choisir une image"}</button>
    ${val ? `<button class="btn" type="button" data-img-retirer>Retirer</button>` : ""}`;
  return {
    html: `<span class="sub">Image de la bulle (facultatif)</span><div class="champ-img" data-champ-img>${dessin()}</div>`,
    brancher(m) {
      const box = $("[data-champ-img]", m);
      const lier = () => {
        $("[data-img-choisir]", box).onclick = async () => { const id = await televerserImage(cote, nom()); if (id) { val = id; box.innerHTML = dessin(); lier(); } };
        $("[data-img-retirer]", box)?.addEventListener("click", () => { val = ""; box.innerHTML = dessin(); lier(); });
      };
      lier();
    },
    valeur: () => val,
  };
}

function monter(liste, i) { if (i > 0) [liste[i - 1], liste[i]] = [liste[i], liste[i - 1]]; }

function actionAdmin(act, id) {
  const c = copieCat();
  switch (act) {
    case "voir-annee": anneeAdmin = id; vueAdmin(); break;
    case "ajout-annee": formAnnee(null); break;
    case "modifier-annee": formAnnee(anneeDe(id)); break;
    case "monter-annee": monter(c.annees, c.annees.findIndex((x) => x.id === id)); publierCat(c, "Ordre des années modifié"); break;
    case "verrou": { const a = c.annees.find((x) => x.id === id); a.verrou = !a.verrou; publierCat(c, a.verrou ? `${a.nom} verrouillée` : `${a.nom} déverrouillée`); break; }
    case "suppr-annee": {
      const a = anneeDe(id);
      confirmer(`Supprimer ${a.nom} ?`, `Ses matières sont supprimées aussi. Ses outils ne sont pas effacés : ils restent dans la recherche et pourront être replacés (Outils ▸ Année).`, "Supprimer", async () => {
        const d = copieCat();
        d.annees = d.annees.filter((x) => x.id !== id);
        d.matieres = d.matieres.filter((m) => m.annee !== id);
        for (const o of OUTILS) { const p = place(o); if (p.annee === id) d.outils[o.id] = { ...(d.outils[o.id] || {}), annee: "-", matiere: null, cache: p.cache }; }
        anneeAdmin = null;
        await publierCat(d, `${a.nom} supprimée`);
      });
      break;
    }
    case "ajout-mat": formMatiere(null, id); break;
    case "modifier-mat": formMatiere(matiereDe(id), null); break;
    case "monter-mat": {
      const m = matiereDe(id);
      const memes = c.matieres.filter((x) => x.annee === m.annee);
      const i = memes.findIndex((x) => x.id === id);
      if (i > 0) { const a = c.matieres.indexOf(memes[i - 1]), b = c.matieres.indexOf(memes[i]); [c.matieres[a], c.matieres[b]] = [c.matieres[b], c.matieres[a]]; }
      publierCat(c, "Ordre des matières modifié");
      break;
    }
    case "suppr-mat": {
      const m = matiereDe(id);
      confirmer(`Supprimer ${m.nom} ?`, `Ses outils ne sont pas effacés : ils passent dans « Autres » de la même année et peuvent être replacés.`, "Supprimer", async () => {
        const d = copieCat();
        d.matieres = d.matieres.filter((x) => x.id !== id);
        for (const o of OUTILS) { const p = place(o); if (p.matiere?.id === id) d.outils[o.id] = { ...(d.outils[o.id] || {}), annee: p.annee, matiere: null, cache: p.cache }; }
        await publierCat(d, `${m.nom} supprimée`);
      });
      break;
    }
    case "nouvel-outil": formNouvelOutil(id, null); break;
    case "annonce": formAnnonce(); break;
    case "suppr-annonce": confirmer("Retirer l'annonce ?", "Elle disparaît de l'accueil de tout le monde.", "Retirer", () => { const d = copieCat(); d.annonce = null; return publierCat(d, "Annonce retirée"); }); break;
    case "sauver": telechargerSauvegarde(); break;
    case "restaurer": choisirFichier("application/json,.json").then((f) => f && restaurerSauvegarde(f)); break;
  }
}

/* ---------- Admin ▸ éditeur d'un outil créé ici (#edit-<id>) ---------- */
let brouillon = null; // { id, sale, titre, emoji, description, type, questions, blocs }

/** Lit des questions collées en texte. Format :
 *  Q: énoncé  (ou « 1. énoncé »)
 *  + bonne proposition   - mauvaise proposition   (ou « A) … » puis « Réponse : A, C »)
 *  E: explication
 */
function lireTexteQcm(txt) {
  const qs = [];
  let q = null;
  const nouvelle = (t) => { q = { q: t, choix: [], bonnes: [], explication: "", image: "" }; qs.push(q); };
  for (const brut of String(txt).split(/\r?\n/)) {
    const l = brut.trim();
    let m;
    if (!l) continue;
    if ((m = l.match(/^(?:Q(?:uestion)?\s*\d*\s*[:.)-]|\d+\s*[.)-])\s*(.+)$/i))) nouvelle(m[1]);
    else if (!q) nouvelle(l);
    else if ((m = l.match(/^(?:R(?:é|e)ponses?|R)\s*:\s*([A-H](?:[\s,;/et]+[A-H])*)\s*$/i))) q.bonnes = [...new Set(m[1].toUpperCase().match(/[A-H]/g).map((x) => "ABCDEFGH".indexOf(x)))].filter((k) => k < q.choix.length);
    else if ((m = l.match(/^(?:E|Expl(?:ication)?|Correction)\s*:\s*(.*)$/i))) q.explication = m[1];
    else if ((m = l.match(/^(?:\+|\*|✓|✔|\[x\])\s*(.+)$/i))) { q.bonnes.push(q.choix.length); q.choix.push(m[1]); }
    else if ((m = l.match(/^(?:-|–|•|\[ \])\s*(.+)$/))) q.choix.push(m[1]);
    else if ((m = l.match(/^[A-H]\s*[).:-]\s*(.+)$/))) q.choix.push(m[1]);
    else if (q.explication) q.explication += "\n" + l;
    else if (!q.choix.length) q.q += " " + l;
    else q.explication = l;
  }
  return qs.filter((x) => x.q && x.choix.length >= 2);
}

  if (!brouillon || brouillon.id !== id) {
    const d = (await C.contenu(id)) || {};

}

  window.scrollTo(0, y);
  const sale = () => { b.sale = true; const e = $("#ed-etat"); if (e) e.textContent = "Modifications non enregistrées"; };
  vue.querySelectorAll("[data-m]").forEach((el) => (el.oninput = () => { b[el.dataset.m] = el.value; sale(); }));
  vue.querySelectorAll("[data-q] [data-f]").forEach((el) => (el.oninput = () => {
    const q = b.questions[+el.closest("[data-q]").dataset.q];
    if (el.dataset.f === "choix") q.choix[+el.dataset.k] = el.value; else q[el.dataset.f] = el.value;
    sale();
  }));
  vue.querySelectorAll("[data-b] [data-f]").forEach((el) => (el.oninput = () => { b.blocs[+el.closest("[data-b]").dataset.b][el.dataset.f] = el.value; sale(); }));
  vue.querySelectorAll("[data-ed]").forEach((el) => (el.onclick = () => actionEditeur(el)));
}

async function actionEditeur(el) {
  const b = brouillon;
  const qi = el.closest("[data-q]") ? +el.closest("[data-q]").dataset.q : -1;
  const bi = el.closest("[data-b]") ? +el.closest("[data-b]").dataset.b : -1;
  const q = b.questions[qi], k = +el.dataset.k;
  const redessiner = () => { b.sale = true; dessinerEditeur(); };
  switch (el.dataset.ed) {
    case "q-ajout": b.questions.push({ q: "", choix: ["", "", "", ""], bonnes: [], explication: "", image: "" }); redessiner();
      requestAnimationFrame(() => vue.querySelector(`[data-q="${b.questions.length - 1}"] textarea`)?.focus()); break;
    case "q-suppr": confirmer(`Supprimer la question ${qi + 1} ?`, q.q || "Question vide", "Supprimer", () => { b.questions.splice(qi, 1); redessiner(); }); break;
    case "q-monter": monter(b.questions, qi); redessiner(); break;
    case "bonne": q.bonnes = q.bonnes.includes(k) ? q.bonnes.filter((x) => x !== k) : [...q.bonnes, k].sort(); redessiner(); break;
    case "choix-ajout": q.choix.push(""); redessiner(); break;
    case "choix-suppr": q.choix.splice(k, 1); q.bonnes = q.bonnes.filter((x) => x !== k).map((x) => (x > k ? x - 1 : x)); redessiner(); break;
    case "q-img": { const id = await televerserImage(1400, `${b.id} q${qi + 1}`); if (id) { q.image = id; redessiner(); } break; }
    case "q-img-suppr": q.image = ""; redessiner(); break;
    case "import": formImport(); break;
    case "b-ajout": {
      if (el.dataset.t === "image") { const id = await televerserImage(1800, b.id); if (!id) return; b.blocs.push({ t: "image", v: id, legende: "" }); }
      else b.blocs.push({ t: el.dataset.t, v: "", legende: "" });
      redessiner();
      break;
    }
    case "b-suppr": b.blocs.splice(bi, 1); redessiner(); break;
    case "b-monter": monter(b.blocs, bi); redessiner(); break;
    case "b-img": { const id = await televerserImage(1800, b.id); if (id) { b.blocs[bi].v = id; redessiner(); } break; }
    case "visible": {
      const c = copieCat();
      c.outils[b.id] = { ...c.outils[b.id], cache: !c.outils[b.id].cache };
      try { appliquerCatalogue(await C.enregistrerCatalogue(c)); toast(c.outils[b.id].cache ? "Outil caché" : "Outil visible"); } catch (e) { toast(C.messageErreur(e)); }
      dessinerEditeur();
      break;
    }
    case "enregistrer": enregistrerBrouillon(); break;
    case "supprimer": supprimerOutilPerso(OUTILS.find((x) => x.id === b.id) || { id: b.id, titre: b.titre }); break;
  }
}

function formImport() {
  ouvrirModal(`<h3>Coller des questions</h3>
    <p class="sub">Une question par paragraphe. Les questions lues sont ajoutées à la suite.</p>
    <pre class="ed-exemple">Q: Le coude comporte combien d'articulations ?
- 1
- 2
+ 3
E: huméro-ulnaire, huméro-radiale, radio-ulnaire sup.

1. Autre question
A) proposition
B) proposition
Réponse : B</pre>
    <textarea class="champ" id="imp-txt" rows="10" placeholder="Coller les questions ici"></textarea>
    <p class="sub" id="imp-lu"></p>
    <div class="modal-btns">
      <button class="btn btn-primary" type="button" data-ok disabled>Ajouter</button>
      <button class="btn" type="button" data-fermer>Annuler</button>
    </div>`, (m) => {
    const t = $("#imp-txt", m), ok = $("[data-ok]", m);
    t.oninput = () => {
      const qs = lireTexteQcm(t.value);
      const sans = qs.filter((q) => !q.bonnes.length).length;
      $("#imp-lu", m).textContent = qs.length ? `${qs.length} question(s) lue(s)${sans ? ` · ${sans} sans bonne réponse (à cocher ensuite)` : ""}` : "Aucune question reconnue pour l'instant.";
      ok.disabled = !qs.length;
    };
    ok.onclick = () => {
      brouillon.questions.push(...lireTexteQcm(t.value));
      brouillon.sale = true;
      fermerModal();
      dessinerEditeur();
      toast("Questions ajoutées : vérifiez-les, puis enregistrez");
    };
  });
}

async function enregistrerBrouillon() {
  const b = brouillon;
  if (!b.titre.trim()) return toast("Ajoutez un titre à l'outil");
  const questions = [];
  for (const [i, q] of b.questions.entries()) {
    const garde = q.choix.map((c, k) => ({ c: c.trim(), bonne: q.bonnes.includes(k) })).filter((x) => x.c);
    if (!q.q.trim() && !garde.length) continue; // question vide : ignorée
    if (!q.q.trim()) return toast(`Question ${i + 1} : énoncé manquant`);
    if (garde.length < 2) return toast(`Question ${i + 1} : il faut au moins 2 propositions`);
    if (!garde.some((x) => x.bonne)) return toast(`Question ${i + 1} : au moins une proposition doit être juste`);
    questions.push({ q: q.q.trim(), choix: garde.map((x) => x.c), bonnes: garde.flatMap((x, k) => (x.bonne ? [k] : [])), explication: q.explication.trim(), image: q.image || "" });
  }
  const blocs = b.blocs.filter((x) => (x.v || "").trim());
  try {
    await C.enregistrerContenu(b.id, { type: b.type, titre: b.titre.trim(), questions, blocs });
    const c = copieCat();
    c.outils[b.id] = { ...c.outils[b.id], titre: b.titre.trim(), emoji: b.emoji.trim() || "📝", description: b.description.trim(), type: b.type };
    appliquerCatalogue(await C.enregistrerCatalogue(c));
    b.questions = JSON.parse(JSON.stringify(questions));
    b.blocs = JSON.parse(JSON.stringify(blocs));
    b.sale = false;
    toast("Enregistré, visible immédiatement" + (c.outils[b.id].cache ? " (une fois l'outil rendu visible)" : ""));
    dessinerEditeur();
  } catch (e) {
    toast(C.messageErreur(e) || "Enregistrement impossible");
  }
}

/* ---------- Navigation ---------- */
const VUES = { accueil: vueAccueil, cours: vueCours, revoir: vueRevoir, erreurs: vueErreurs, recherche: vueRecherche, favoris: vueFavoris, profil: vueProfil, reglages: vueReglages, admin: vueAdmin, "a-propos": vueAPropos };
const LARGEUR_VUE = { profil: "etroite", reglages: "etroite", admin: "moyenne", edit: "moyenne", "a-propos": "moyenne" };
const TITRES_VUE = { accueil: "Aujourd'hui", cours: "Mes cours", revoir: "À revoir", erreurs: "Mes erreurs", recherche: "Recherche", favoris: "Favoris", profil: "Profil", reglages: "Réglages", admin: "Admin", "a-propos": "À propos" };
let rendu = 0;
/** Largeur de la page, et courte entrée en fondu quand on change de page
 *  (pas quand la même page est redessinée, par ex. à l'arrivée du catalogue : elle clignoterait). */
let routePrecedente = null;
function classeVue(largeur, nom) {
  const nouvelle = nom !== routePrecedente;
  routePrecedente = nom;
  const garder = !nouvelle && vue.classList.contains("entree");
  vue.className = "vue vue-" + largeur + (garder ? " entree" : "");
  if (!nouvelle) return;
  void vue.offsetWidth;
  vue.classList.add("entree");
}

function route() {
  rendu++;
  fermerModal();
  arretVue?.();
  arretVue = null;
  const nom = location.hash.slice(1) || "accueil";
  if (nom.startsWith("edit-")) {
    classeVue("moyenne", nom);
    document.title = "Éditeur · EOPour les nuls";
    majBarreLaterale("admin");
    document.querySelectorAll(".tab").forEach((t) => {
      const actif = t.dataset.vue === "admin";
      t.classList.toggle("actif", actif);
      if (actif) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current");
    });
    return vueEditeur(nom.slice(5));
  }
  const annee = anneeDe(nom) ? nom : null;
  const cle = annee ? "cours" : Object.prototype.hasOwnProperty.call(VUES, nom) ? nom : "accueil";
  const onglet = cle === "reglages" ? "profil" : cle;
  classeVue(annee ? "large" : LARGEUR_VUE[cle] || "large", nom);
  document.title = `${annee ? anneeDe(annee).nom : TITRES_VUE[cle]} · EOPour les nuls`;
  majBarreLaterale(annee || cle);
  if (annee) {
    document.querySelectorAll(".tab").forEach((t) => {
      const actif = t.dataset.vue === "cours";
      t.classList.toggle("actif", actif);
      if (actif) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current");
    });
    return vueAnnee(annee);
  }
  document.querySelectorAll(".tab").forEach((t) => {
    const actif = t.dataset.vue === onglet;
    t.classList.toggle("actif", actif);
    if (actif) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current");
  });
  VUES[cle]();
}

function majOngletProfil(u) {
  const emoji = C.avatarSur(u?.avatar);
  const photo = C.imageSure(u?.image) || C.photoSure(u?.photo);
  $("#tab-avatar").innerHTML = emoji ? `<span class="emoji">${emoji}</span>`
    : photo ? `<img src="${esc(photo)}" alt="" referrerpolicy="no-referrer">`
    : u ? `<b>${esc(initiale(u.nom))}</b>` : ICONE.user;
}

window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });
window.addEventListener("pageshow", (e) => { if (e.persisted) route(); }); // retour d'un QCM : scores à jour
$("#ouvrir-recherche").onclick = ouvrirPaletteAvecLexique;
$("#recherche-k").onclick = ouvrirPaletteAvecLexique;
let jeSuisAdmin = false;
C.surChangement(async (u) => {
  majOngletProfil(u);
  jeSuisAdmin = await C.estAdmin();
  route();
  $('.tab[data-vue="admin"]').hidden = !jeSuisAdmin;
  if (u && R.lire().fun == null) demanderModeFun();
  if (u) proposerInstallation(); // seulement une fois connecté (juste après la création du compte pour un nouveau membre)
});

/** Première connexion sur cet appareil : fun ou sobre ? (modifiable ensuite dans Réglages) */
function demanderModeFun() {
  ouvrirModal(`<h3>Comment souhaitez-vous réviser ?</h3>
    <p class="sub">Ce choix reste modifiable dans Réglages ▸ Mode ludique.</p>
    <div class="choix-mode">
      <button class="choix-carte" type="button" data-fun="1"><span aria-hidden="true">${ICONES.trophee}</span><b>Mode ludique</b><small>Série de jours, objectif quotidien et graphique de la semaine</small></button>
      <button class="choix-carte" type="button" data-fun="0"><span aria-hidden="true">${ICONES.livre}</span><b>Mode sobre</b><small>Uniquement les cours et les QCM, sans compteur ni objectif</small></button>
    </div>`, (m) => {
    m.querySelectorAll("[data-fun]").forEach((b) => (b.onclick = () => {
      R.ecrire("fun", b.dataset.fun === "1");
      fermerModal();
      toast(b.dataset.fun === "1" ? "Mode ludique activé" : "Mode sobre activé");
      route();
    }));
  });
  modal.addEventListener("close", () => { if (R.lire().fun == null) R.ecrire("fun", true); }, { once: true });
}

// Images de la médiathèque : remplies dès qu'elles apparaissent dans la page ou une fenêtre
new MutationObserver(() => C.hydraterMedias(document.body)).observe(document.body, { childList: true, subtree: true });
appliquerCatalogue(C.catalogueLocal());
majOngletProfil(null);
route();
C.chargerCatalogue().then((c) => { appliquerCatalogue(c); if (location.hash !== "#admin") route(); });

// Appli installable + hors-ligne (réseau d'abord)
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
