<main id="vue" class="vue"></main>
<div id="toast" class="toast" role="status" hidden></div>
<dialog id="modal" class="modal"></dialog>

<script type="module">
import { OUTILS, MATIERES, ANNEES, INFOS_MATIERES } from "./outils.js?v=9";
import * as C from "./compte.js?v=9";

const R = window.Reglages;

/* ---------- Outils ---------- */
const $ = (s, r = document) => r.querySelector(s);
const vue = $("#vue");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const sansAccents = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const TEINTES = [174, 199, 228, 256, 282, 322, 350, 18, 146];
const teinte = (txt) => { let h = 0; for (const c of txt) h = (h * 31 + c.codePointAt(0)) >>> 0; return TEINTES[h % TEINTES.length]; };
const initiale = (nom) => (Array.from(String(nom || "?").trim())[0] || "?").toUpperCase();
const navigateurIntegre = /Instagram|FBAN|FBAV|FB_IAB|Snapchat|Line\/|TikTok|musical_ly|; wv\)/i.test(navigator.userAgent);
const lienSite = () => new URL("./", location.href).href;

const svg = (corps) => `<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${corps}</svg>`;
const ICONE = {
  coeur: svg('<path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 7.9 3.6 4.5 7 4.5c2 0 3.6 1.1 5 3 1.4-1.9 3-3 5-3 3.4 0 5.6 3.4 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/>'),
  envoyer: svg('<path d="M21 3 10 14"/><path d="M21 3l-6.5 18-4.5-7-7-4.5z"/>'),
  loupe: svg('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'),
  user: svg('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/>'),
  grille: svg('<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/>'),
  menu: svg('<path d="M4 7h16M4 12h16M4 17h16"/>'),
  retour: svg('<path d="M15 5l-7 7 7 7"/>'),
  fermer: svg('<path d="M6 6l12 12M18 6 6 18"/>'),
};

let minuteurToast;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(minuteurToast);
  minuteurToast = setTimeout(() => (t.hidden = true), 2600);
}

async function partager(titre, url) {
  if (navigator.share) {
    try { await navigator.share({ title: titre, url }); return; }
    catch (e) { if (e.name === "AbortError") return; }
  }
  try { await navigator.clipboard.writeText(url); toast("Lien copié 📋"); }
  catch { toast(url); }
}

function avatar(u) {
  const emoji = C.avatarSur(u?.avatar);
  if (emoji) return `<span class="avatar-ring"><span class="avatar emoji">${emoji}</span></span>`;
  const photo = C.imageSure(u?.image) || C.photoSure(u?.photo);
  const contenu = photo ? `<img src="${esc(photo)}" alt="" referrerpolicy="no-referrer">`
    : u ? esc(initiale(u.nom)) : ICONE.user;
  return `<span class="avatar-ring"><span class="avatar">${contenu}</span></span>`;
}

const vide = (icone, titre, texte) => `<div class="vide">${icone}<h2>${esc(titre)}</h2><p>${esc(texte)}</p></div>`;

function grille(liste) {
  return `<div class="grille">${liste.map((o) => {
    const s = C.scoreLocal(o.id);
    return `<a class="tuile" href="${esc(o.fichier)}" style="--h:${teinte(o.matiere)}" aria-label="${esc(o.titre)}">
      <span class="tuile-emoji" aria-hidden="true">${esc(o.emoji || "📝")}</span>
      <span class="tuile-titre">${esc(o.titre)}</span>
      ${s ? `<span class="tuile-badge">${s.best}/${s.total}</span>` : ""}
    </a>`;
  }).join("")}</div>`;
}

/* ---------- Fenêtre modale ---------- */
const modal = $("#modal");
function ouvrirModal(html, brancher) {
  if (!modal.open) modal.className = "modal";
  modal.innerHTML = `<div class="modal-corps">${html}</div>`;
  modal.querySelectorAll("[data-fermer]").forEach((b) => (b.onclick = fermerModal));
  brancher?.(modal);
  if (!modal.open) modal.showModal();
}
function fermerModal() { if (modal.open) modal.close(); }
modal.addEventListener("click", (e) => { if (e.target === modal) fermerModal(); }); // clic sur le fond

function confirmer(titre, texte, libelle, action) {
  ouvrirModal(`<h3>${esc(titre)}</h3><p>${esc(texte)}</p>
    <div class="modal-btns">
      <button class="btn btn-danger" type="button" data-ok>${esc(libelle)}</button>
      <button class="btn" type="button" data-fermer>Annuler</button>
    </div>`, (m) => {
    $("[data-ok]", m).onclick = async () => { fermerModal(); await action(); };
  });
}

/* ---------- Catalogue : années, matières, place des outils ----------
   L'admin le publie depuis Admin ▸ Organisation (compte.js, site/catalogue) ; sinon on le déduit de outils.js. */
const slug = (s) => sansAccents(String(s || "")).replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "x";
function catalogueDeBase() {
  const annees = ANNEES.map((a) => ({ id: a.id, nom: a.nom, sous: a.sous || "", verrou: !!a.verrou }));
  const matieres = [], outils = {};
  for (const o of OUTILS) {
    const an = (o.annee || "").toLowerCase();
    let m = matieres.find((x) => x.annee === an && x.nom === o.matiere);
    if (!m) {
      const info = INFOS_MATIERES[o.matiere] || {};
      m = { id: "m-" + slug(an + "-" + o.matiere), annee: an, nom: o.matiere, emoji: MATIERES[o.matiere] || o.emoji || "📚", complet: info.nom || "", prof: info.prof || "" };
      matieres.push(m);
    }
    outils[o.id] = { annee: an, matiere: m.id, cache: false };
  }
  return { annees, matieres, outils, masques: {}, annonce: null, images: {} };
}
const ID_BASE = new Set(OUTILS.map((o) => o.id));                                   // outils de outils.js
const ORIG = new Map(OUTILS.map((o) => [o.id, { titre: o.titre, emoji: o.emoji }])); // avant retouche par l'admin
let CAT = catalogueDeBase();
let catPublie = false; // true = l'admin a déjà publié une organisation
function appliquerCatalogue(c) {
  catPublie = !!c;
  for (let k = OUTILS.length - 1; k >= 0; k--) if (!ID_BASE.has(OUTILS[k].id)) OUTILS.splice(k, 1);
  const base = catalogueDeBase();
  CAT = c ? { annees: c.annees, matieres: c.matieres, outils: { ...base.outils, ...c.outils }, masques: c.masques || {}, annonce: c.annonce || null, images: c.images || {} } : base;
  for (const o of OUTILS) {
    const p = CAT.outils[o.id] || {}, d = ORIG.get(o.id);
    o.titre = (typeof p.titre === "string" && p.titre) || d.titre;
    o.emoji = (typeof p.emoji === "string" && p.emoji) || d.emoji;
  }
  // Outils écrits depuis l'admin (QCM, fiches) : une seule page, outils/contenu.html?id=…
  for (const [id, p] of Object.entries(CAT.outils)) {
    if (!p || !p.perso || ID_BASE.has(id) || !/^[a-z0-9-]+$/.test(id)) continue;
    const type = p.type === "fiche" ? "fiche" : "qcm";
    OUTILS.push({ id, perso: true, typePerso: type, titre: String(p.titre || "Sans titre"), emoji: String(p.emoji || "📝"), type: type === "qcm" ? "QCM" : "Fiche",
      description: String(p.description || ""), fichier: "outils/contenu.html?id=" + id, matiere: matiereDe(p.matiere)?.nom || "", annee: p.annee });
  }
}
const anneeDe = (id) => CAT.annees.find((a) => a.id === id) || null;
const matiereDe = (id) => CAT.matieres.find((m) => m.id === id) || null;
/** Où l'outil s'affiche : année, matière (ou null = « Autres »), caché ou non. */
function place(o) {
  const p = CAT.outils[o.id] || {};
  const annee = p.annee || (o.annee || "").toLowerCase();
  let m = matiereDe(p.matiere);
  if (p.matiere !== null && (!m || m.annee !== annee)) m = CAT.matieres.find((x) => x.annee === annee && x.nom === o.matiere) || null;
  if (m && m.annee !== annee) m = null;
  return { annee, matiere: m, cache: !!p.cache, nouveau: !!p.nouveau };
}
const outilsVisibles = () => OUTILS.filter((o) => !place(o).cache);
const outilsAnnee = (a) => outilsVisibles().filter((o) => place(o).annee === a.id);
const matieresAnnee = (a) => CAT.matieres.filter((m) => m.annee === a.id);
/** Image de l'admin (médiathèque) si elle existe, sinon l'emoji. */
const visuel = (x, defaut) => (x?.image ? `<img class="visuel" data-media="${esc(x.image)}" alt="">` : esc(x?.emoji || defaut));
const ICONE_VERROU = svg('<rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>');

/* ---------- Accueil : choisir son année ---------- */
function carteBienvenue() {
  try { if (localStorage.getItem("bienvenue-vue")) return ""; } catch {}
  return `<div class="bienvenue" id="bienvenue" role="note">
    <b>Bienvenue sur EOPour les nuls 👋</b>
    <p>Choisis ton année, puis ta matière. Touche ♡ sur un outil pour le garder en favori. Dans Profil, connecte-toi pour retrouver ta progression partout.</p>
    <button class="icon-btn" type="button" id="fermer-bienvenue" aria-label="Masquer ce message">${ICONE.fermer}</button>
  </div>`;
}

function carteAnnonce() {
  const a = CAT.annonce;
  if (!a || !a.texte) return "";
  try { if (localStorage.getItem("annonce-vue") === a.id) return ""; } catch {}
  const lien = a.lien ? (a.lien.startsWith("#") ? a.lien : a.lien) : "";
  const cible = a.lien.startsWith("#") ? anneeDe(a.lien.slice(1))?.nom : OUTILS.find((o) => o.fichier === a.lien)?.titre;
  return `<div class="annonce" id="annonce" role="note"><span class="annonce-ico" aria-hidden="true">📣</span>
    <div class="annonce-txt"><b>${esc(a.titre || "Annonce")}</b><p>${esc(a.texte)}</p>${lien && cible ? `<a class="btn btn-primary annonce-btn" href="${esc(lien)}">${esc(cible)} →</a>` : ""}</div>
    <button class="icon-btn" type="button" id="fermer-annonce" aria-label="Masquer l'annonce">${ICONE.fermer}</button></div>`;
}

function dernierOutil() {
  try { return outilsVisibles().find((o) => o.id === localStorage.getItem("dernier-outil")) || null; } catch { return null; }
}

function vueAccueil() {
  const u = C.utilisateur();
  const prenom = u?.nom ? String(u.nom).trim().split(/\s+/)[0] : "";
  const dernier = dernierOutil();
  vue.innerHTML = `
    <div class="accueil-tete"><h1>${prenom ? "Salut " + esc(prenom) : "Salut"}</h1><p class="sub">Choisis ton année, puis ta matière.</p></div>
    ${carteAnnonce()}
    ${carteBienvenue()}
    <div class="annees" role="list">
      ${CAT.annees.map((a) => {
        const n = matieresAnnee(a).length;
        const etat = a.verrou ? " verrou" : n ? "" : " vide-annee";
        return `<a class="annee${etat}" role="listitem" href="#${esc(a.id)}"${a.verrou ? ` aria-label="${esc(a.nom)}, verrouillé"` : ""}>
          <span class="annee-ring"><span class="annee-bulle">${a.image ? `<img class="visuel" data-media="${esc(a.image)}" alt="">` : esc(a.nom)}</span>${a.verrou ? `<span class="annee-cadenas">${ICONE_VERROU}</span>` : ""}</span>
          <b>${esc(a.sous)}</b>
          <small>${a.verrou ? "Verrouillé" : n ? `${n} matière${n > 1 ? "s" : ""}` : "Aucune matière"}</small>
        </a>`;
      }).join("")}
    </div>
    ${dernier ? `<h2 class="titre-section">Reprendre</h2><div class="lignes">${ligneOutil(dernier)}</div>` : ""}`;
  $("#fermer-annonce")?.addEventListener("click", () => {
    try { localStorage.setItem("annonce-vue", CAT.annonce.id); } catch {}
    $("#annonce").remove();
  });
  $("#fermer-bienvenue")?.addEventListener("click", () => {
    try { localStorage.setItem("bienvenue-vue", "1"); } catch {}
    $("#bienvenue").remove();
  });
  brancherLignes();
}

/* ---------- Une année : ses matières (bulles), puis les outils de la matière ---------- */
const matiereChoisie = {};
const AUTRES = { id: "_autres", nom: "Autres", emoji: "📦", complet: "Autres outils", prof: "" };

function vueAnnee(id) {
  const a = anneeDe(id);
  const retour = `<div class="profil-barre" style="margin: 0; padding: 0 8px 0 4px;">
    <a class="icon-btn" href="#accueil" aria-label="Retour aux années">${ICONE.retour}</a><b>${esc(a.nom)}${a.sous ? " · " + esc(a.sous) : ""}</b><span style="width: 44px;"></span></div>`;
  if (a.verrou) {
    vue.innerHTML = retour + `<div class="vide">${ICONE_VERROU}<h2>${esc(a.nom)} est verrouillé</h2><p>Ce parcours ouvrira plus tard.</p></div>`;
    return;
  }
  const outils = outilsAnnee(a);
  const matieres = matieresAnnee(a).slice();
  if (outils.some((o) => !place(o).matiere)) matieres.push(AUTRES);
  if (!matieres.length) {
    vue.innerHTML = retour + vide(ICONE.grille, `Pas encore de matière en ${a.nom}`, "Les matières s'ajouteront ici au fil des cours.");
    return;
  }
  let m = matieres.find((x) => x.id === matiereChoisie[id]) || matieres[0];
  matiereChoisie[id] = m.id;
  const liste = outils.filter((o) => (place(o).matiere?.id || AUTRES.id) === m.id);
  vue.innerHTML = retour + `
    <div class="stories" role="group" aria-label="Matières de ${esc(a.nom)}">
      ${matieres.map((x) => `
        <button class="story${x.id === m.id ? " actif" : ""}" type="button" data-m="${esc(x.id)}" aria-pressed="${x.id === m.id}">
          <span class="story-ring"><span class="story-bulle">${visuel(x, "📚")}</span></span>
          <span class="story-nom">${esc(x.nom)}</span>
        </button>`).join("")}
    </div>
    <div class="matiere-tete">
      <span class="mini-ring grand"><span>${visuel(m, "📚")}</span></span>
      <div><h1>${esc(m.complet || m.nom)}</h1><p class="sub">${[m.complet ? m.nom : "", m.prof, `${liste.length} outil${liste.length > 1 ? "s" : ""}`].filter(Boolean).map(esc).join(" · ")}</p></div>
    </div>
    ${liste.length ? `<div class="lignes">${liste.map(ligneOutil).join("")}</div>` : `<p class="vide-mini">Pas encore d'outil dans cette matière.</p>`}
    ${jeSuisAdmin ? `<div class="admin-raccourcis"><span class="sub">Admin</span><button class="btn" type="button" id="adm-placer">Placer un outil ici</button><button class="btn" type="button" id="adm-creer">Créer un outil ici</button></div>` : ""}`;
  vue.querySelectorAll(".story").forEach((b) => (b.onclick = () => { matiereChoisie[id] = b.dataset.m; vueAnnee(id); }));
  $("#adm-placer")?.addEventListener("click", () => placerOutil(id, m.id === AUTRES.id ? null : m.id));
  $("#adm-creer")?.addEventListener("click", () => formNouvelOutil(id, m.id === AUTRES.id ? null : m.id));
  brancherLignes();
}

/* Un outil = une ligne : emoji, titre, type, meilleur score, favori. */
function ligneOutil(o) {
  const s = C.scoreLocal(o.id);
  const fav = C.favorisLocaux().has(o.id);
  return `<div class="ligne-outil" data-id="${esc(o.id)}">
    <a class="lo-lien" href="${esc(o.fichier)}">
      <span class="lo-emoji" style="--h:${teinte(o.matiere)}" aria-hidden="true">${esc(o.emoji || "📝")}</span>
      <span class="lo-txt"><b>${esc(o.titre)}${place(o).nouveau ? ` <span class="badge-nouveau">Nouveau</span>` : ""}</b><small>${esc(o.type || "Outil")}${s ? ` · meilleur score ${s.best}/${s.total}` : ""}</small>
        <span class="lo-desc">${esc(o.description)}</span>
        ${s ? `<span class="jauge"><i style="width:${Math.round((s.best / s.total) * 100)}%"></i></span>` : ""}</span>
    </a>
    <span class="lo-actions">
      <button class="action com" type="button" data-com="${esc(o.id)}" aria-label="Commentaires sur ${esc(o.titre)}">${ICONE_BULLE}<span class="com-n"></span></button>
      <button class="action like${fav ? " on" : ""}" type="button" aria-pressed="${fav}" aria-label="${fav ? "Retirer des favoris" : "Ajouter aux favoris"}">${ICONE.coeur}</button>
    </span>
  </div>`;
}

function brancherLignes() {
  vue.querySelectorAll(".ligne-outil").forEach((el) => {
    const id = el.dataset.id;
    const like = $(".like", el);
    like.onclick = () => {
      const actif = C.basculerFavori(id);
      like.classList.toggle("on", actif);
      like.setAttribute("aria-pressed", String(actif));
      like.setAttribute("aria-label", actif ? "Retirer des favoris" : "Ajouter aux favoris");
      like.classList.remove("pop");
      void like.offsetWidth;
      like.classList.add("pop");
    };
    $(".lo-lien", el).addEventListener("click", () => { try { localStorage.setItem("dernier-outil", id); } catch {} });

  });
  majCompteurs();
}

let convs = [];               // mes conversations (écoute globale, pour la pastille)

const ICONE_BULLE = svg('<path d="M20.5 11.5a8.5 8.5 0 0 1-12.6 7.4L3.5 20.5l1.6-4.2A8.5 8.5 0 1 1 20.5 11.5z"/>');
const ICONE_MSG = svg('<path d="M12 3C7 3 3 6.6 3 11c0 2.4 1.2 4.6 3.1 6.1L5.5 21l4-2.1c.8.2 1.6.3 2.5.3 5 0 9-3.6 9-8.1S17 3 12 3z"/><path d="m8 12 2.6-2.6L13 12l3-3"/>');

/* Commentaires d'un outil, dans la fenêtre maison */
function ouvrirCommentaires(o) {
  const u = C.utilisateur();
  if (!C.comptesActifs) return toast("Les comptes ne sont pas encore disponibles");
  if (!u) { toast("Connecte-toi pour lire et écrire des commentaires"); location.hash = "#profil"; return; }
  let arret = () => {};
  let admin = false;
  C.estAdmin().then((a) => { admin = a; });
  ouvrirModal(`<div class="com-tete"><b>Commentaires</b><small>${esc(o.titre)}</small><button class="icon-btn" type="button" data-fermer aria-label="Fermer">${ICONE.fermer}</button></div>
    <div class="com-liste" id="com-liste"><p class="vide-mini">Chargement…</p></div>
    <form class="com-form" id="com-form">
      ${petitAvatar(u)}
      <input class="champ" id="com-texte" maxlength="500" placeholder="Ajoute un commentaire…" autocomplete="off" enterkeyhint="send" aria-label="Ton commentaire">
      <button class="lien" type="submit">Publier</button>
    </form>`, (m) => {
    m.classList.add("modal-com");
    const liste = $("#com-liste", m), champ = $("#com-texte", m);
    const dessiner = (coms) => {
      if (!coms.length) { liste.innerHTML = `<div class="com-vide">${ICONE_BULLE}<b>Pas encore de commentaire</b><p>Lance la discussion : une astuce, une question, une erreur repérée.</p></div>`; return; }
      liste.innerHTML = coms.map((c) => `<div class="com" data-id="${esc(c.id)}">
        ${petitAvatar({ nom: c.nom, photo: c.photo, avatar: c.avatar })}
        <div class="com-corps"><p><b>${esc(c.nom)}</b> ${esc(c.texte)}</p>
          <small>${quand(c.le)} · <button class="lien com-rep" type="button" data-nom="${esc(c.nom)}">Répondre</button>${c.de === u.uid || admin ? ` · <button class="lien com-suppr" type="button">Supprimer</button>` : ""}</small></div>
      </div>`).join("");
      liste.scrollTop = liste.scrollHeight;
      liste.querySelectorAll(".com-rep").forEach((b) => (b.onclick = () => { champ.value = `@${b.dataset.nom} `; champ.focus(); }));
      liste.querySelectorAll(".com-suppr").forEach((b) => (b.onclick = async () => {
        try { await C.supprimerCommentaire(o.id, b.closest(".com").dataset.id); toast("Commentaire supprimé"); } catch (e) { toast(C.messageErreur(e)); }
      }));
    };
    arret = C.ecouterCommentaires(o.id, dessiner, (e) => { liste.innerHTML = `<p class="erreur vide-mini">${esc(C.messageErreur(e))}</p>`; });
    $("#com-form", m).onsubmit = async (e) => {
      e.preventDefault();
      const t = champ.value.trim();
      if (!t) return;
      champ.value = "";
      try { await C.ajouterCommentaire(o.id, t); majCompteurs(); } catch (err) { champ.value = t; toast(C.messageErreur(err)); }
    };
    if (matchMedia("(pointer: fine)").matches) champ.focus();
  });
  modal.addEventListener("close", () => { arret(); modal.classList.remove("modal-com"); }, { once: true });
}

/* Nombre de commentaires affiché à côté de chaque outil */
async function majCompteurs() {
  if (!C.utilisateur()) return;
  const boutons = [...vue.querySelectorAll("[data-com]")];
  if (!boutons.length) return;
  const n = await C.nbCommentaires([...new Set(boutons.map((b) => b.dataset.com))]);
  boutons.forEach((b) => { const v = n[b.dataset.com] || 0; const s = $(".com-n", b); if (s) s.textContent = v ? String(v) : ""; });
}

/* Pastille des messages non lus (barre du haut + barre latérale) */
function suivreConversations(u) {
  arretConvs?.();
  arretConvs = null;
  convs = [];
  majPastille();

function majPastille() {

/* Messages : la liste des conversations */

/* Une conversation */
async function vueConversation(autre) {
  const r = rendu;
  const u = C.utilisateur();
  if (!u) { vue.innerHTML = connecteOu("Tes messages privés"); return; }
  const p = (await C.profils([autre]))[autre];
  if (r !== rendu) return;
  vue.innerHTML = `<div class="dm">
    <div class="profil-barre dm-barre"><a class="icon-btn" href="#messages" aria-label="Retour aux messages">${ICONE.retour}</a>${petitAvatar(p)}<b>${esc(p.nom)}</b><span style="width: 44px;"></span></div>
    <div class="dm-fil" id="dm-fil"><p class="vide-mini">Chargement…</p></div>
    <form class="dm-form" id="dm-form">
      <textarea class="champ" id="dm-texte" rows="1" maxlength="1000" placeholder="Écris un message…" aria-label="Ton message"></textarea>
      <button class="icon-btn dm-envoi" type="submit" aria-label="Envoyer">${ICONE_ENVOI}</button>
    </form></div>`;
  const fil = $("#dm-fil"), champ = $("#dm-texte");
  const dessiner = (msgs) => {
    if (!msgs.length) { fil.innerHTML = `<div class="com-vide">${avatar(p)}<b>${esc(p.nom)}</b><p>Écris le premier message.</p></div>`; return; }
    let jour = "";
    fil.innerHTML = msgs.map((m) => {
      const d = new Date(m.le), j = d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
      const sep = j !== jour ? `<p class="dm-jour">${esc(j)}</p>` : "";
      jour = j;
      return `${sep}<div class="bulle${m.de === u.uid ? " moi" : ""}" data-id="${esc(m.id)}" title="${esc(d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }))}">${esc(m.texte)}</div>`;
    }).join("");
    fil.scrollTop = fil.scrollHeight;
    fil.querySelectorAll(".bulle.moi").forEach((b) => (b.onclick = () => confirmer("Supprimer ce message ?", "Il disparaît aussi chez ton correspondant.", "Supprimer",
      async () => { try { await C.supprimerMessage(autre, b.dataset.id); } catch (e) { toast(C.messageErreur(e)); } })));
    C.marquerLu(autre);
  };
  // Conversation pas encore créée : la lecture est refusée tant qu'aucun message n'existe → on réécoute après l'envoi.
  const ecouter = () => { arretVue?.(); arretVue = C.ecouterMessages(autre, dessiner, () => dessiner([])); };
  ecouter();
  champ.addEventListener("input", () => { champ.style.height = "auto"; champ.style.height = Math.min(champ.scrollHeight, 140) + "px"; });
  champ.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && matchMedia("(pointer: fine)").matches) { e.preventDefault(); $("#dm-form").requestSubmit(); } });
  $("#dm-form").onsubmit = async (e) => {
    e.preventDefault();
    const t = champ.value.trim();
    if (!t) return;
    const nouvelle = !convs.some((c) => c.autre === autre);
    champ.value = "";
    champ.style.height = "auto";
    try { await C.envoyerMessage(autre, t); if (nouvelle) ecouter(); } catch (err) { champ.value = t; toast(C.messageErreur(err)); }
  };
  if (matchMedia("(pointer: fine)").matches) champ.focus();
}

/* ---------- Profil + connexion ---------- */
let modeInscription = false;
const LETTRES_JOURS = ["D", "L", "M", "M", "J", "V", "S"];

function statsLocales() {
  const faits = OUTILS.map((o) => C.scoreLocal(o.id)).filter(Boolean);
  const best = faits.reduce((a, s) => a + s.best, 0);
  const total = faits.reduce((a, s) => a + s.total, 0);
  return { faits: faits.length, reussite: total ? Math.round((best / total) * 100) : null, favoris: C.favorisLocaux().size };
}

const modeFun = () => R.lire().fun !== false;
function blocActivite() {
  if (!modeFun()) return "";
  const a = C.activiteLocale();
  const objectif = Number(R.lire().objectif) || 3;
  const ajd = a[C.jourCle()] || 0;
  const serie = C.serieJours(a);
  const jours = [];
  const d = new Date();
  d.setDate(d.getDate() - 6);
  for (let k = 0; k < 7; k++) {
    jours.push({ n: a[C.jourCle(d)] || 0, lettre: LETTRES_JOURS[d.getDay()], ajd: k === 6 });
    d.setDate(d.getDate() + 1);
  }
  const max = Math.max(1, ...jours.map((j) => j.n));
  return `<div class="activite">
    <div class="activite-haut">
      <div class="serie">${serie ? "🔥" : "💤"} <b>${serie}</b> jour${serie > 1 ? "s" : ""} d'affilée</div>
      <div class="objectif">Objectif du jour <b>${Math.min(ajd, objectif)}/${objectif}</b>${ajd >= objectif ? " ✅" : ""}
        <span class="jauge"><i style="width:${Math.min(100, Math.round((ajd / objectif) * 100))}%"></i></span></div>
    </div>
    <div class="semaine" aria-label="QCM terminés ces 7 derniers jours">
      ${jours.map((j) => `<div class="jour${j.n ? "" : " vide-jour"}${j.ajd ? " ajd" : ""}" title="${j.n} QCM">
        <i style="height:${j.n ? Math.max(14, Math.round((j.n / max) * 100)) : 6}%"></i><span>${j.lettre}</span></div>`).join("")}
    </div>
  </div>`;
}

function vueProfil() {
  const u = C.utilisateur();
  const st = statsLocales();
  const joues = OUTILS.filter((o) => C.scoreLocal(o.id));
  const stats = `<div class="stats">
      <div><b>${st.faits}</b><span>QCM faits</span></div>
      <div><b>${st.reussite == null ? "–" : st.reussite + " %"}</b><span>réussite</span></div>
      <div><b>${st.favoris}</b><span>favoris</span></div>
    </div>`;
  const mesQcm = `<h2 class="titre-section">${ICONE.grille} ${u ? "Mes QCM" : "Sur cet appareil"}</h2>`
    + (joues.length ? grille(joues) : `<p class="vide-mini">Fais un QCM : il apparaîtra ici avec ton meilleur score.</p>`);
  const barre = `<div class="profil-barre"><b>Profil</b><a class="icon-btn" href="#reglages" aria-label="Réglages">${ICONE.menu}</a></div>`;

  if (!u) {
    vue.innerHTML = `<div class="profil">${barre}
      ${C.comptesActifs ? formulaireConnexion() : `<div class="connexion"><span class="logo">EO<span>Pour les nuls</span></span><p>Les comptes arrivent très bientôt. En attendant, ta progression est gardée sur cet appareil.</p></div>`}
      <div class="profil-tete local">${avatar(null)}${stats}</div>
      ${blocActivite()}
      ${mesQcm}
    </div>`;
    if (C.comptesActifs) brancherConnexion();
    return;
  }

  vue.innerHTML = `<div class="profil">${barre}
    <div class="profil-tete">${avatar(u)}${stats}</div>
    <p class="profil-nom">${esc(u.nom)}</p>
    ${u.email ? `<p class="profil-mail">${esc(u.email)}</p>` : ""}
    <div class="profil-actions">
      <button class="btn" type="button" id="btn-modifier">Modifier le profil</button>
      <a class="btn" href="#reglages">Réglages</a>
    </div>
    ${blocActivite()}

  $("#btn-modifier").onclick = modalProfil;

    <p>Connecte-toi pour retrouver ta progression sur tous tes appareils.</p>

    <form id="form-email" novalidate>
      ${ins ? `<input class="champ" name="nom" placeholder="Prénom ou pseudo" maxlength="40" autocomplete="nickname">` : ""}

      <button class="lien" type="button" id="btn-bascule">${ins ? "Se connecter" : "Inscris-toi"}</button></p>
  </div>`;

function brancherConnexion() {
  const form = $("#form-email");
  const erreur = (e) => {
    const p = $("#erreur");
    const m = C.messageErreur(e);
    p.textContent = m;
    p.hidden = !m;
  };
  $("#btn-google").onclick = async () => {
    erreur(null);
    try { await C.connexionGoogle(); } catch (e) { erreur(e); }
  };
  $("#btn-bascule").onclick = () => { modeInscription = !modeInscription; vueProfil(); };
  $("#btn-oubli")?.addEventListener("click", async () => {
    const email = form.email.value.trim();
    if (!email) return erreur({ code: "app/email-requis" });
    try { await C.motDePasseOublie(email); toast("Si un compte existe, un e-mail t'a été envoyé"); }
    catch (e) { erreur(e); }
  });
  form.onsubmit = async (ev) => {
    ev.preventDefault();
    erreur(null);
    const bouton = form.querySelector('button[type="submit"]');
    bouton.disabled = true;
    try {
      if (modeInscription) await C.inscriptionEmail(form.nom.value, form.email.value.trim(), form.mdp.value);
      else await C.connexionEmail(form.email.value.trim(), form.mdp.value);
      modeInscription = false;
    } catch (e) {
      erreur(e);
      bouton.disabled = false;
    }
  };
}

/* ---------- Réglages ---------- */
let invitInstall = null;
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); invitInstall = e; });
window.addEventListener("appinstalled", () => { invitInstall = null; toast("Appli installée ✓"); });
const estInstallee = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const surIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

async function installer() {
  if (estInstallee()) return toast("L'appli est déjà installée ✓");
  if (invitInstall) {
    invitInstall.prompt();
    await invitInstall.userChoice.catch(() => {});
    invitInstall = null;
    return;
  }
  ouvrirModal(`<h3>Installer l'appli</h3>
    <p>${surIOS
      ? "Dans Safari, touche le bouton Partager (le carré avec une flèche), puis « Sur l'écran d'accueil »."
      : "Ouvre le menu du navigateur (⋮), puis « Installer l'application » ou « Ajouter à l'écran d'accueil »."}</p>
    <div class="modal-btns"><button class="btn btn-primary" type="button" data-fermer>OK</button></div>`);
}

function modalSuppression() {
  const google = C.compteViaGoogle();
  ouvrirModal(`<h3>Supprimer ton compte ?</h3>
    <p>Ton compte et toute la progression enregistrée dessus seront effacés définitivement.
      ${google ? "Google va te demander de confirmer que c'est bien toi." : "Entre ton mot de passe pour confirmer."}</p>
    <form id="form-suppr">
      ${google ? "" : `<input class="champ" name="mdp" type="password" placeholder="Mot de passe" autocomplete="current-password">`}
      <p class="erreur" id="erreur-suppr" role="alert" hidden></p>
      <div class="modal-btns">
        <button class="btn btn-danger" type="submit">Supprimer définitivement</button>
        <button class="btn" type="button" data-fermer>Annuler</button>
      </div>
    </form>`, (m) => {
    const f = $("#form-suppr", m);
    f.onsubmit = async (e) => {
      e.preventDefault();
      const bouton = f.querySelector('button[type="submit"]');
      bouton.disabled = true;
      try {
        await C.supprimerCompte(f.mdp?.value);
        fermerModal();
        toast("Compte supprimé");
        location.hash = "#profil";
      } catch (err) {
        const p = $("#erreur-suppr", m);
        const msg = C.messageErreur(err);
        p.textContent = msg;
        p.hidden = !msg;
        bouton.disabled = false;
      }
    };
  });
}

/* ---------- Admin ---------- */
const enMs = (t) => (t && typeof t.toMillis === "function" ? t.toMillis() : 0);

function depuis(t) {
  if (!t) return "jamais vu";
  const min = Math.round((Date.now() - t) / 60000);
  if (min < 2) return "à l'instant";
  if (min < 60) return `il y a ${min} min`;
  const h = Math.round(min / 60);
  if (h < 24) return `il y a ${h} h`;
  const j = Math.round(h / 24);
  return j < 30 ? `il y a ${j} j` : new Date(t).toLocaleDateString("fr-FR");
}

function ligneMembre(m) {
  const sc = Object.values(m.scores || {}).filter((s) => s && s.total > 0);
  const b = sc.reduce((a, s) => a + (s.best || 0), 0);
  const t = sc.reduce((a, s) => a + s.total, 0);
  const serie = C.serieJours(activiteDe(m));
  return `<li><button class="membre" type="button" data-uid="${esc(m.uid)}">${avatar({ nom: m.nom || "?", photo: m.photo, avatar: m.avatar })}
    <div><b>${esc(m.nom || "Sans nom")}</b>
    <small>${sc.length} QCM${t ? ` · ${Math.round((b / t) * 100)} % de réussite` : ""}${serie ? ` · 🔥 ${serie}` : ""} · ${depuis(enMs(m.vuLe))}</small></div>
    <span class="chevron" aria-hidden="true">›</span></button></li>`;
}

const activiteDe = (m) => (m && m.activite && typeof m.activite === "object" && !Array.isArray(m.activite) ? m.activite : {});
const reussiteDe = (m) => {
  const sc = Object.values(m.scores || {}).filter((s) => s && s.total > 0);
  const t = sc.reduce((a, s) => a + s.total, 0);
  return t ? sc.reduce((a, s) => a + (s.best || 0), 0) / t : -1;
};
/** Les n derniers jours (dates), du plus ancien à aujourd'hui. */
function joursRecents(n = 14) {
  return Array.from({ length: n }, (_, i) => { const d = new Date(); d.setDate(d.getDate() - (n - 1) + i); return d; });
}
/** Petit graphique en barres (un jour par barre), avec un résumé pour les lecteurs d'écran. */
function barresJours(valeurs, jours, unite) {
  const max = Math.max(1, ...valeurs);
  const total = valeurs.reduce((a, b) => a + b, 0);
  return `<div class="barres" role="img" aria-label="${total} ${unite} sur ${jours.length} jours">
    ${valeurs.map((v, i) => `<div class="barre${i === valeurs.length - 1 ? " auj" : ""}" title="${jours[i].toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" })} : ${v} ${unite}">
      <span class="barre-n">${v || ""}</span><i style="height:${Math.round((v / max) * 100)}%"></i>
      <small>${jours[i].toLocaleDateString("fr-FR", { weekday: "narrow" })}</small></div>`).join("")}
  </div>`;
}

/* ---------- Admin ▸ Tableau de bord ---------- */
function vueStats(onglets, liste) {
  const jours = joursRecents(14);
  const cles = jours.map((d) => C.jourCle(d));
  const auj = cles[cles.length - 1], sept = cles.slice(-7);
  const actifsAuj = liste.filter((m) => activiteDe(m)[auj]).length;
  const actifs7 = liste.filter((m) => sept.some((j) => activiteDe(m)[j])).length;
  const nouveaux = liste.filter((m) => enMs(m.creeLe) && Date.now() - enMs(m.creeLe) < 7 * 864e5).length;
  const vus24 = liste.filter((m) => Date.now() - enMs(m.vuLe) < 864e5).length;
  const parJour = cles.map((j) => liste.reduce((s, m) => s + (Number(activiteDe(m)[j]) || 0), 0));
  const actifsParJour = cles.map((j) => liste.filter((m) => activiteDe(m)[j]).length);
  const parties7 = parJour.slice(-7).reduce((a, b) => a + b, 0);
  let b = 0, t = 0;
  const parOutil = {};
  for (const m of liste) for (const [id, s] of Object.entries(m.scores || {})) {
    if (!s || !(s.total > 0)) continue;
    b += s.best || 0; t += s.total;
    const o = (parOutil[id] ||= { n: 0, b: 0, t: 0 });
    o.n++; o.b += s.best || 0; o.t += s.total;
  }
  const top = Object.entries(parOutil).sort((x, y) => y[1].n - x[1].n).slice(0, 6);
  const series = liste.map((m) => ({ m, s: C.serieJours(activiteDe(m)) })).filter((x) => x.s > 0).sort((x, y) => y.s - x.s).slice(0, 5);
  const tuile = (n, l, d = "") => `<div class="stat-tuile"><b>${n}</b><span>${l}</span>${d ? `<small>${d}</small>` : ""}</div>`;
  const titreOutil = (id) => OUTILS.find((o) => o.id === id) || { titre: id, emoji: "📝" };
  vue.innerHTML = `<h1 class="titre-vue">Admin</h1>${onglets}
  <div class="reglages admin-stats">
    <div class="stat-tuiles">
      ${tuile(liste.length, "membres", nouveaux ? `+${nouveaux} cette semaine` : "")}
      ${tuile(actifsAuj, "actifs aujourd'hui", `${vus24} passé(s) sur le site en 24 h`)}
      ${tuile(actifs7, "actifs sur 7 jours", liste.length ? `${Math.round((actifs7 / liste.length) * 100)} % des membres` : "")}
      ${tuile(parties7, "parties sur 7 jours", t ? `réussite moyenne ${Math.round((b / t) * 100)} %` : "")}
    </div>
    <h2>Parties par jour</h2>
    <div class="groupe stat-bloc">${barresJours(parJour, jours, "parties")}</div>
    <h2>Membres actifs par jour</h2>
    <div class="groupe stat-bloc">${barresJours(actifsParJour, jours, "membres actifs")}</div>
    <h2>Outils les plus joués</h2>
    <div class="groupe">${top.length ? top.map(([id, s]) => { const o = titreOutil(id); const p = Math.round((s.b / s.t) * 100); return `<div class="ligne stat-outil">
      <span class="ligne-ico" aria-hidden="true">${esc(o.emoji || "📝")}</span>
      <span class="ligne-txt"><b>${esc(o.titre)}</b><small>${s.n} membre${s.n > 1 ? "s" : ""} · réussite moyenne ${p} %</small><span class="jauge"><i style="width:${p}%"></i></span></span></div>`; }).join("")
      : `<div class="ligne"><span class="ligne-txt"><small>Aucun score enregistré pour l'instant.</small></span></div>`}</div>
    <h2>Plus longues séries 🔥</h2>
    <div class="groupe">${series.length ? series.map(({ m, s }) => `<button class="ligne" type="button" data-uid="${esc(m.uid)}">${petitAvatar({ nom: m.nom || "?", photo: m.photo, avatar: m.avatar })}
      <span class="ligne-txt"><b>${esc(m.nom || "Sans nom")}</b><small>${s} jour${s > 1 ? "s" : ""} d'affilée</small></span><span class="chevron" aria-hidden="true">›</span></button>`).join("")
      : `<div class="ligne"><span class="ligne-txt"><small>Personne n'a de série en cours.</small></span></div>`}</div>
    <p class="note">Chiffres tirés des comptes (les visiteurs sans compte ne sont pas comptés). <button class="lien" type="button" id="stats-maj">Actualiser</button></p>
  </div>`;
  vue.querySelectorAll("[data-uid]").forEach((el) => (el.onclick = () => ficheMembre(liste.find((m) => m.uid === el.dataset.uid))));
  $("#stats-maj").onclick = async () => { try { await lesMembres(true); } catch {} vueAdmin(); };
}

/* ---------- Admin ▸ Membres : recherche, tri, fiche ---------- */
function vueMembres(onglets, liste) {
  const TRIS = [["recents", "Récents"], ["nom", "Nom"], ["reussite", "Réussite"], ["serie", "Série"]];
  vue.innerHTML = `<h1 class="titre-vue">Admin · ${liste.length} membre${liste.length > 1 ? "s" : ""}</h1>${onglets}
    <div class="adm-outils-membres">
      <input class="champ" id="adm-cherche" type="search" placeholder="Chercher un membre" aria-label="Chercher un membre" autocomplete="off">
      <div class="segmente" role="group" aria-label="Trier par">${TRIS.map(([v, l]) => `<button type="button" data-tri="${v}" aria-pressed="${triMembres === v}">${l}</button>`).join("")}</div>
    </div>
    <ul class="membres" id="adm-liste"></ul>`;
  const champ = $("#adm-cherche");
  champ.value = filtreMembres;
  const dessiner = () => {
    const q = sansAccents(filtreMembres.trim());
    const tri = {
      recents: (a, b) => enMs(b.vuLe) - enMs(a.vuLe),
      nom: (a, b) => String(a.nom || "").localeCompare(String(b.nom || ""), "fr"),
      reussite: (a, b) => reussiteDe(b) - reussiteDe(a),
      serie: (a, b) => C.serieJours(activiteDe(b)) - C.serieJours(activiteDe(a)),
    }[triMembres];
    const vus = liste.filter((m) => !q || sansAccents(String(m.nom || "")).includes(q)).sort(tri);
    $("#adm-liste").innerHTML = vus.map(ligneMembre).join("") || `<li class="vide-mini">Aucun membre ne correspond.</li>`;
    vue.querySelectorAll("#adm-liste [data-uid]").forEach((el) => (el.onclick = () => ficheMembre(liste.find((m) => m.uid === el.dataset.uid))));
  };
  champ.oninput = () => { filtreMembres = champ.value; dessiner(); };
  vue.querySelectorAll("[data-tri]").forEach((b) => (b.onclick = () => {
    triMembres = b.dataset.tri;
    vue.querySelectorAll("[data-tri]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    dessiner();
  }));
  dessiner();
}

function ficheMembre(m) {
  if (!m) return;
  const jours = joursRecents(14);
  const a = activiteDe(m);
  const scores = Object.entries(m.scores || {}).filter(([, s]) => s && s.total > 0)
    .map(([id, s]) => ({ o: OUTILS.find((x) => x.id === id) || { titre: id, emoji: "📝" }, s }))
    .sort((x, y) => y.s.best / y.s.total - x.s.best / x.s.total);
  const r = reussiteDe(m);
  const serie = C.serieJours(a);
  const moi = C.utilisateur()?.uid === m.uid;
  const cree = enMs(m.creeLe);
  ouvrirModal(`<div class="fiche-tete">${avatar({ nom: m.nom || "?", photo: m.photo, avatar: m.avatar })}
      <div><h3>${esc(m.nom || "Sans nom")}</h3><small>${cree ? `Inscrit le ${new Date(cree).toLocaleDateString("fr-FR")}` : "Date d'inscription inconnue"} · vu ${depuis(enMs(m.vuLe))}</small></div></div>
    <div class="stat-tuiles petites">
      <div class="stat-tuile"><b>${scores.length}</b><span>QCM</span></div>
      <div class="stat-tuile"><b>${r < 0 ? "—" : Math.round(r * 100) + " %"}</b><span>réussite</span></div>
      <div class="stat-tuile"><b>${serie}</b><span>série 🔥</span></div>
      <div class="stat-tuile"><b>${Array.isArray(m.favoris) ? m.favoris.length : 0}</b><span>favoris</span></div>
    </div>
    <p class="sub fiche-sous">Parties sur 14 jours</p>

/** Publie une nouvelle organisation : visible tout de suite par tout le monde. */
async function publierCat(c, message) {
  try {
    const propre = await C.enregistrerCatalogue(c);
    appliquerCatalogue(propre);
    toast(message || "Enregistré");
  } catch (e) {
    toast(C.messageErreur(e) || "Enregistrement impossible");
  }
  if (location.hash === "#admin") vueAdmin();
}

/** Ouvre le sélecteur de fichiers (à appeler pendant un clic) ; renvoie le fichier choisi ou null. */
function choisirFichier(accept = "image/*") {
  return new Promise((ok) => {
    const i = document.createElement("input");
    i.type = "file";
    i.accept = accept;
    i.onchange = () => ok(i.files[0] || null);
    i.addEventListener("cancel", () => ok(null));
    i.click();
  });
}
/** Choisit une image et l'envoie dans la médiathèque ; renvoie son id (ou null). */
async function televerserImage(cote, nom) {
  const f = await choisirFichier();
  if (!f) return null;
  toast("Envoi de l'image…");
  try {
    const id = await C.televerserMedia(f, { cote, nom });
    toast("Image ajoutée ✓");
    return id;
  } catch (e) {
    toast(C.messageErreur(e));
    return null;
  }
}

  const actuelle = ((CAT.images || {})[o.id] || {})[cid];

/** Champ « image » d'un formulaire (année, matière) : renvoie { html, brancher(m), valeur() }. */
function champImage(actuelle, cote, nom) {
  let val = actuelle || "";
  const dessin = () => `${val ? `<img class="champ-img-apercu" data-media="${esc(val)}" alt="">` : `<span class="champ-img-vide">Aucune image : l'emoji est utilisé</span>`}
    <button class="btn" type="button" data-img-choisir>${val ? "Changer" : "Choisir une image"}</button>
    ${val ? `<button class="btn" type="button" data-img-retirer>Retirer</button>` : ""}`;
  return {
    html: `<span class="sub">Image de la bulle (facultatif)</span><div class="champ-img" data-champ-img>${dessin()}</div>`,
    brancher(m) {
      const box = $("[data-champ-img]", m);
      const lier = () => {
        $("[data-img-choisir]", box).onclick = async () => { const id = await televerserImage(cote, nom()); if (id) { val = id; box.innerHTML = dessin(); lier(); } };
        $("[data-img-retirer]", box)?.addEventListener("click", () => { val = ""; box.innerHTML = dessin(); lier(); });
      };
      lier();
    },
    valeur: () => val,
  };
}

  const c = copieCat();

    case "ajout-annee": formAnnee(null); break;

    case "monter-annee": monter(c.annees, c.annees.findIndex((x) => x.id === id)); publierCat(c, "Ordre des années modifié"); break;
    case "verrou": { const a = c.annees.find((x) => x.id === id); a.verrou = !a.verrou; publierCat(c, a.verrou ? `${a.nom} verrouillée` : `${a.nom} déverrouillée`); break; }
    case "suppr-annee": {
      const a = anneeDe(id);
      confirmer(`Supprimer ${a.nom} ?`, `Ses matières sont supprimées aussi. Ses outils ne sont pas effacés : ils restent dans la recherche et tu pourras les replacer (Outils ▸ Année).`, "Supprimer", async () => {
        const d = copieCat();
        d.annees = d.annees.filter((x) => x.id !== id);
        d.matieres = d.matieres.filter((m) => m.annee !== id);
        for (const o of OUTILS) { const p = place(o); if (p.annee === id) d.outils[o.id] = { ...(d.outils[o.id] || {}), annee: "-", matiere: null, cache: p.cache }; }
        anneeAdmin = null;
        await publierCat(d, `${a.nom} supprimée`);
      });
      break;
    }
    case "ajout-mat": formMatiere(null, id); break;
    case "modifier-mat": formMatiere(matiereDe(id), null); break;
    case "monter-mat": {
      const m = matiereDe(id);
      const memes = c.matieres.filter((x) => x.annee === m.annee);
      const i = memes.findIndex((x) => x.id === id);
      if (i > 0) { const a = c.matieres.indexOf(memes[i - 1]), b = c.matieres.indexOf(memes[i]); [c.matieres[a], c.matieres[b]] = [c.matieres[b], c.matieres[a]]; }
      publierCat(c, "Ordre des matières modifié");
      break;
    }
    case "suppr-mat": {
      const m = matiereDe(id);

        const d = copieCat();

/* ---------- Admin ▸ éditeur d'un outil créé ici (#edit-<id>) ---------- */
let brouillon = null; // { id, sale, titre, emoji, description, type, questions, blocs }

/** Lit des questions collées en texte. Format :
 *  Q: énoncé  (ou « 1. énoncé »)
 *  + bonne proposition   - mauvaise proposition   (ou « A) … » puis « Réponse : A, C »)
 *  E: explication
 */
function lireTexteQcm(txt) {
  const qs = [];
  let q = null;
  const nouvelle = (t) => { q = { q: t, choix: [], bonnes: [], explication: "", image: "" }; qs.push(q); };
  for (const brut of String(txt).split(/\r?\n/)) {
    const l = brut.trim();
    let m;
    if (!l) continue;
    if ((m = l.match(/^(?:Q(?:uestion)?\s*\d*\s*[:.)-]|\d+\s*[.)-])\s*(.+)$/i))) nouvelle(m[1]);
    else if (!q) nouvelle(l);
    else if ((m = l.match(/^(?:R(?:é|e)ponses?|R)\s*:\s*([A-H](?:[\s,;/et]+[A-H])*)\s*$/i))) q.bonnes = [...new Set(m[1].toUpperCase().match(/[A-H]/g).map((x) => "ABCDEFGH".indexOf(x)))].filter((k) => k < q.choix.length);
    else if ((m = l.match(/^(?:E|Expl(?:ication)?|Correction)\s*:\s*(.*)$/i))) q.explication = m[1];
    else if ((m = l.match(/^(?:\+|\*|✓|✔|\[x\])\s*(.+)$/i))) { q.bonnes.push(q.choix.length); q.choix.push(m[1]); }
    else if ((m = l.match(/^(?:-|–|•|\[ \])\s*(.+)$/))) q.choix.push(m[1]);
    else if ((m = l.match(/^[A-H]\s*[).:-]\s*(.+)$/))) q.choix.push(m[1]);
    else if (q.explication) q.explication += "\n" + l;
    else if (!q.choix.length) q.q += " " + l;
    else q.explication = l;
  }
  return qs.filter((x) => x.q && x.choix.length >= 2);
}

async function actionEditeur(el) {
  const b = brouillon;
  const qi = el.closest("[data-q]") ? +el.closest("[data-q]").dataset.q : -1;
  const bi = el.closest("[data-b]") ? +el.closest("[data-b]").dataset.b : -1;
  const q = b.questions[qi], k = +el.dataset.k;
  const redessiner = () => { b.sale = true; dessinerEditeur(); };
  switch (el.dataset.ed) {
    case "q-ajout": b.questions.push({ q: "", choix: ["", "", "", ""], bonnes: [], explication: "", image: "" }); redessiner();
      requestAnimationFrame(() => vue.querySelector(`[data-q="${b.questions.length - 1}"] textarea`)?.focus()); break;
    case "q-suppr": confirmer(`Supprimer la question ${qi + 1} ?`, q.q || "Question vide", "Supprimer", () => { b.questions.splice(qi, 1); redessiner(); }); break;
    case "q-monter": monter(b.questions, qi); redessiner(); break;
    case "bonne": q.bonnes = q.bonnes.includes(k) ? q.bonnes.filter((x) => x !== k) : [...q.bonnes, k].sort(); redessiner(); break;
    case "choix-ajout": q.choix.push(""); redessiner(); break;
    case "choix-suppr": q.choix.splice(k, 1); q.bonnes = q.bonnes.filter((x) => x !== k).map((x) => (x > k ? x - 1 : x)); redessiner(); break;
    case "q-img": { const id = await televerserImage(1400, `${b.id} q${qi + 1}`); if (id) { q.image = id; redessiner(); } break; }
    case "q-img-suppr": q.image = ""; redessiner(); break;
    case "import": formImport(); break;
    case "b-ajout": {
      if (el.dataset.t === "image") { const id = await televerserImage(1800, b.id); if (!id) return; b.blocs.push({ t: "image", v: id, legende: "" }); }
      else b.blocs.push({ t: el.dataset.t, v: "", legende: "" });
      redessiner();
      break;
    }
    case "b-suppr": b.blocs.splice(bi, 1); redessiner(); break;
    case "b-monter": monter(b.blocs, bi); redessiner(); break;
    case "b-img": { const id = await televerserImage(1800, b.id); if (id) { b.blocs[bi].v = id; redessiner(); } break; }
    case "visible": {
      const c = copieCat();
      c.outils[b.id] = { ...c.outils[b.id], cache: !c.outils[b.id].cache };
      try { appliquerCatalogue(await C.enregistrerCatalogue(c)); toast(c.outils[b.id].cache ? "Outil caché" : "Outil visible ✓"); } catch (e) { toast(C.messageErreur(e)); }
      dessinerEditeur();
      break;
    }
    case "enregistrer": enregistrerBrouillon(); break;
    case "supprimer": supprimerOutilPerso(OUTILS.find((x) => x.id === b.id) || { id: b.id, titre: b.titre }); break;
  }
}

    <div class="modal-btns">
      <button class="btn btn-primary" type="button" data-ok disabled>Ajouter</button>
      <button class="btn" type="button" data-fermer>Annuler</button>
    </div>`, (m) => {
    const t = $("#imp-txt", m), ok = $("[data-ok]", m);
    t.oninput = () => {
      const qs = lireTexteQcm(t.value);
      const sans = qs.filter((q) => !q.bonnes.length).length;
      $("#imp-lu", m).textContent = qs.length ? `${qs.length} question(s) lue(s)${sans ? ` · ${sans} sans bonne réponse (à cocher ensuite)` : ""}` : "Aucune question reconnue pour l'instant.";
      ok.disabled = !qs.length;
    };
    ok.onclick = () => {
      brouillon.questions.push(...lireTexteQcm(t.value));
      brouillon.sale = true;
      fermerModal();
      dessinerEditeur();
      toast("Questions ajoutées : vérifie-les puis enregistre");
    };
  });
}

async function enregistrerBrouillon() {
  const b = brouillon;
  if (!b.titre.trim()) return toast("Donne un titre à l'outil");
  const questions = [];
  for (const [i, q] of b.questions.entries()) {
    const garde = q.choix.map((c, k) => ({ c: c.trim(), bonne: q.bonnes.includes(k) })).filter((x) => x.c);
    if (!q.q.trim() && !garde.length) continue; // question vide : ignorée
    if (!q.q.trim()) return toast(`Question ${i + 1} : écris l'énoncé`);
    if (garde.length < 2) return toast(`Question ${i + 1} : il faut au moins 2 propositions`);
    if (!garde.some((x) => x.bonne)) return toast(`Question ${i + 1} : coche au moins une proposition juste`);
    questions.push({ q: q.q.trim(), choix: garde.map((x) => x.c), bonnes: garde.flatMap((x, k) => (x.bonne ? [k] : [])), explication: q.explication.trim(), image: q.image || "" });
  }
  const blocs = b.blocs.filter((x) => (x.v || "").trim());
  try {
    await C.enregistrerContenu(b.id, { type: b.type, titre: b.titre.trim(), questions, blocs });
    const c = copieCat();
    c.outils[b.id] = { ...c.outils[b.id], titre: b.titre.trim(), emoji: b.emoji.trim() || "📝", description: b.description.trim(), type: b.type };
    appliquerCatalogue(await C.enregistrerCatalogue(c));
    b.questions = JSON.parse(JSON.stringify(questions));
    b.blocs = JSON.parse(JSON.stringify(blocs));
    b.sale = false;
    toast("Enregistré ✓ — visible tout de suite" + (c.outils[b.id].cache ? " (une fois l'outil rendu visible)" : ""));
    dessinerEditeur();
  } catch (e) {
    toast(C.messageErreur(e) || "Enregistrement impossible");
  }
}

/* ---------- Navigation ---------- */
const VUES = { accueil: vueAccueil, recherche: vueRecherche, favoris: vueFavoris, messages: vueMessages, profil: vueProfil, reglages: vueReglages, admin: vueAdmin };
let rendu = 0;

function route() {
  rendu++;
  fermerModal();
  arretVue?.();
  arretVue = null;
  const nom = location.hash.slice(1) || "accueil";
  document.body.classList.toggle("en-dm", nom.startsWith("dm-"));
  if (nom.startsWith("edit-")) {
    document.querySelectorAll(".tab").forEach((t) => {
      const actif = t.dataset.vue === "admin";
      t.classList.toggle("actif", actif);
      if (actif) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current");
    });
    return vueEditeur(nom.slice(5));
  }
  if (nom.startsWith("dm-")) {
    document.querySelectorAll(".tab").forEach((t) => {
      const actif = t.dataset.vue === "messages";
      t.classList.toggle("actif", actif);
      if (actif) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current");
    });
    return vueConversation(nom.slice(3));
  }
  const annee = anneeDe(nom) ? nom : null;
  const cle = annee ? "accueil" : Object.prototype.hasOwnProperty.call(VUES, nom) ? nom : "accueil";
  const onglet = cle === "reglages" && !matchMedia("(min-width: 1000px)").matches ? "profil" : cle;
  if (annee) {
    document.querySelectorAll(".tab").forEach((t) => {
      const actif = t.dataset.vue === "accueil";
      t.classList.toggle("actif", actif);
      if (actif) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current");
    });
    return vueAnnee(annee);
  }
  document.querySelectorAll(".tab").forEach((t) => {
    const actif = t.dataset.vue === onglet;
    t.classList.toggle("actif", actif);
    if (actif) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current");
  });
  VUES[cle]();
}

function majOngletProfil(u) {
  const emoji = C.avatarSur(u?.avatar);
  const photo = C.imageSure(u?.image) || C.photoSure(u?.photo);
  $("#tab-avatar").innerHTML = emoji ? `<span class="emoji">${emoji}</span>`
    : photo ? `<img src="${esc(photo)}" alt="" referrerpolicy="no-referrer">`
    : u ? `<b>${esc(initiale(u.nom))}</b>` : ICONE.user;
}

window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });
window.addEventListener("pageshow", (e) => { if (e.persisted) route(); }); // retour d'un QCM : scores à jour
$("#partager-site").onclick = () => partager("EOPour les nuls", lienSite());
let jeSuisAdmin = false;
C.surChangement(async (u) => {
  majOngletProfil(u);
  suivreConversations(u);
  jeSuisAdmin = await C.estAdmin();
  route();
  $('.tab[data-vue="admin"]').hidden = !jeSuisAdmin;
  if (u && R.lire().fun == null) demanderModeFun();
});

/** Première connexion sur cet appareil : fun ou sobre ? (modifiable ensuite dans Réglages) */
function demanderModeFun() {
  ouvrirModal(`<h3>Comment tu veux réviser ?</h3>
    <p class="sub">Tu pourras changer d'avis dans Réglages ▸ Mode fun.</p>
    <div class="choix-mode">
      <button class="choix-carte" type="button" data-fun="1"><span aria-hidden="true">🎉</span><b>Mode fun</b><small>Série de jours 🔥, objectif du jour, petites animations</small></button>
      <button class="choix-carte" type="button" data-fun="0"><span aria-hidden="true">📚</span><b>Mode sobre</b><small>Juste les cours et les QCM, sans compteurs ni objectifs</small></button>
    </div>`, (m) => {
    m.querySelectorAll("[data-fun]").forEach((b) => (b.onclick = () => {
      R.ecrire("fun", b.dataset.fun === "1");
      fermerModal();
      toast(b.dataset.fun === "1" ? "Mode fun activé 🎉" : "Mode sobre activé");
      route();
    }));
  });
  modal.addEventListener("close", () => { if (R.lire().fun == null) R.ecrire("fun", true); }, { once: true });
}

// Images de la médiathèque : remplies dès qu'elles apparaissent dans la page ou une fenêtre
new MutationObserver(() => C.hydraterMedias(document.body)).observe(document.body, { childList: true, subtree: true });
appliquerCatalogue(C.catalogueLocal());
majOngletProfil(null);
route();
C.chargerCatalogue().then((c) => { appliquerCatalogue(c); if (location.hash !== "#admin") route(); });

// Appli installable + hors-ligne (réseau d'abord)
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
